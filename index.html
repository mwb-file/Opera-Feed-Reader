<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Personal news</title>
<link rel="manifest" id="manifestLink">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@alwatr/font@0.21.0/sahel.min.css" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iransans-fontface@0.1.1/css/iransans/iransans-fontface.min.css" fetchpriority="low">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/vazirmatn@5.3.0/index.min.css" fetchpriority="low">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v4.0.5/dist/font-face.css" fetchpriority="low">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css" fetchpriority="low">

<style>
*{box-sizing:border-box}
:root{
  --bg:#070b12;--bg-soft:#0b1119;
  --panel:#121a26;--panel-2:#18222f;--panel-hover:#1e2a3a;
  --line:#1f2a3a;--line-2:#2a3648;
  --text:#e9eef7;--text-dim:#b0bccd;--mute:#6c7a90;
  --blue:#4da3ff;--blue-2:#2f88e0;--blue-soft:rgba(77,163,255,.14);
  --red:#ff4d6a;--green:#3ddc97;--amber:#ffbe4d;--star:#ffce4d;
  --shadow:0 4px 24px rgba(0,0,0,.35);
  --radius:12px;--radius-sm:8px;
  --t:.2s cubic-bezier(.4,0,.2,1);
  --header-h:60px;
  --header-bg:rgba(7,11,18,.82);
  --skeleton:linear-gradient(90deg,#141c28 0%,#1c2836 50%,#141c28 100%);
  --rd-size:17px;
  --font-sahel:  "Sahel", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-iransans:"IRANSans", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-vazir:  "Vazirmatn", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-samim:  "Samim", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-shabnam:"Shabnam", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-system: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Tahoma", sans-serif;
  --font-app: var(--font-sahel);
  --font-reader: var(--font-sahel);
}
[data-font="iransans"]{ --font-app:var(--font-iransans); --font-reader:var(--font-iransans); }
[data-font="vazir"]   { --font-app:var(--font-vazir);    --font-reader:var(--font-vazir); }
[data-font="samim"]   { --font-app:var(--font-samim);    --font-reader:var(--font-samim); }
[data-font="shabnam"] { --font-app:var(--font-shabnam);  --font-reader:var(--font-shabnam); }
[data-font="system"]  { --font-app:var(--font-system);   --font-reader:var(--font-system); }
[data-theme="light"]{
  --bg:#f4f7fb;--bg-soft:#eaeff7;
  --panel:#ffffff;--panel-2:#f2f5fa;--panel-hover:#e8eef8;
  --line:#e2e8f0;--line-2:#d0d8e4;
  --text:#0f1826;--text-dim:#45526a;--mute:#7b8a9e;
  --blue:#1573e6;--blue-2:#0a5dc0;--blue-soft:rgba(21,115,230,.1);
  --shadow:0 4px 20px rgba(30,50,90,.08);
  --header-bg:rgba(244,247,251,.88);
  --skeleton:linear-gradient(90deg,#eef2f8 0%,#e0e7f1 50%,#eef2f8 100%);
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 var(--font-app);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background var(--t),color var(--t);
  min-height:100vh;
}
body.reader-open{overflow:hidden}
button{font-family:inherit}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

header{
  position:sticky;top:0;z-index:50;
  height:var(--header-h);display:flex;align-items:center;gap:16px;
  padding:0 18px;
  background:var(--header-bg);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
  transition:background var(--t),border-color var(--t);
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:26px;height:26px;border-radius:50%;border:4px solid var(--red);position:relative;box-shadow:0 0 0 2px rgba(255,27,45,.12)}
.logo::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--red);opacity:.15}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap}
@media(max-width:640px){header h1{display:none}}

.search-wrap{flex:1;max-width:520px;position:relative;margin:0 auto;display:flex;align-items:center}
.search{
  width:100%;height:36px;border-radius:18px;border:1px solid var(--line-2);
  background:var(--bg-soft);color:var(--text);
  padding-inline-start:36px;padding-inline-end:38px;
  font-size:13px;outline:none;
  transition:border-color var(--t),background var(--t),box-shadow var(--t);
}
.search::placeholder{color:var(--mute)}
.search:focus{border-color:var(--blue);background:var(--panel);box-shadow:0 0 0 3px var(--blue-soft)}
.search-icon{position:absolute;inset-inline-start:12px;color:var(--mute);font-size:15px;pointer-events:none;line-height:1}
.search-clear{position:absolute;inset-inline-end:8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--panel-2);color:var(--text-dim);cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.search-clear:hover{background:var(--panel-hover);color:var(--text)}

.head-actions{display:flex;gap:4px;flex:none}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background var(--t),color var(--t),transform var(--t)}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.layout{display:flex;min-height:calc(100vh - var(--header-h))}
aside{width:250px;flex:none;border-inline-end:1px solid var(--line);padding:20px 12px 30px;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;scrollbar-width:thin}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}

.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-dim);text-decoration:none;cursor:pointer;font-size:13px;transition:background var(--t),color var(--t);user-select:none}
.nav-link:hover{background:var(--panel-2);color:var(--text)}
.nav-link.on{background:var(--blue-soft);color:var(--blue);font-weight:500}
.nav-link .ico{width:16px;text-align:center;font-size:13px;opacity:.9}
.nav-link .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-link .badge{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--panel-2);color:var(--text-dim);font-weight:500}
.nav-link.on .badge{background:rgba(77,163,255,.2);color:var(--blue)}

aside .grp{margin:20px 10px 6px;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
aside .grp button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:0}
aside .grp button:hover{color:var(--blue)}

.src-row{display:flex;align-items:center;gap:4px;border-radius:var(--radius-sm);transition:background var(--t)}
.src-row:hover{background:var(--panel-2)}
.src-row .nav-link{flex:1;background:transparent!important}
.src-row .nav-link:hover{background:transparent}
.src-row .mini{width:24px;height:24px;border-radius:6px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--t),background var(--t),color var(--t)}
.src-row:hover .mini{opacity:1}
.src-row .mini:hover{background:var(--panel-hover);color:var(--text)}
.src-row .mini.rm:hover{color:var(--red)}

main{flex:1;padding-block:22px 80px;padding-inline:26px;min-width:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.title-wrap{display:flex;align-items:baseline;gap:10px;min-width:0}
.top h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.2px}
.count{font-size:12px;color:var(--mute)}
.tact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.seg{display:flex;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.seg button{min-width:32px;height:28px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px;transition:background var(--t),color var(--t)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--blue);color:#fff}
.seg.hide{display:none}

.feed{max-width:920px;margin:28px auto 0}
.feed h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.feed h3::after{content:"";flex:1;height:1px;background:var(--line)}
.feed h3:first-child{margin-top:6px}

.card{display:flex;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;color:inherit;text-decoration:none;height:160px;overflow:hidden;position:relative;border-radius:var(--radius);opacity:1;transition:transform var(--t),border-color var(--t),background var(--t),box-shadow var(--t),opacity .28s ease}
.card.enter{opacity:0;transform:translateY(6px)}
.card:hover{background:var(--panel-2);border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.card.read{opacity:.62}
.card.read .t{color:var(--text-dim)}
.card .im{width:250px;flex:none;background:var(--panel-2) center/cover no-repeat;position:relative}
.card .bd{padding:14px 18px;min-width:0;flex:1;display:flex;flex-direction:column;gap:6px;position:relative}
.meta{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta b{color:var(--blue);font-weight:600}
.meta .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block;flex:none}
.card.read .meta .dot{background:var(--mute);opacity:.5}
.card .t{font-size:15.5px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.1px}
.card .s{color:var(--mute);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:auto}
.save-btn{position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;background:transparent;border:0;opacity:0;transition:opacity var(--t),color var(--t),background var(--t),transform var(--t)}
.card:hover .save-btn{opacity:1}
.save-btn:hover{background:var(--panel-hover);color:var(--text);transform:scale(1.08)}
.save-btn.on{opacity:1;color:var(--star)}

.grid .feed{max-width:1320px}
.feed{container-type:inline-size}
.row{display:flex;flex-wrap:wrap;margin:0 -8px 6px;--ih:calc(100cqw * .27)}
.row>.card,.row>.stack{flex:1 1 0;min-width:0;margin:8px}
.row .card{flex-direction:column;height:auto}
.row .card .im{width:100%;height:var(--ih);flex:none}
.row .card .bd{height:150px;flex:none;overflow:hidden}
.row .card .t{-webkit-line-clamp:2}
.row .card .s{-webkit-line-clamp:2}
.row .card.tx .bd{height:auto;flex:1}
.row .card.tx .t{-webkit-line-clamp:4}
.row.b>:nth-child(1),.row.b>:nth-child(2){flex-grow:2}
.row.c{--ih:calc(100cqw * .19)}
.row.c.tt .card{height:130px}
.card.tx .meta{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.card.tx .tm{display:none}
.row.c.tt .bd{padding:10px 12px}
.row.c.tt .t{font-size:13px;-webkit-line-clamp:3}
.row.c.tt .s{-webkit-line-clamp:1;font-size:11px}
.stack{display:flex;flex-direction:column}
.stack .card{flex:1 1 0;min-height:0;margin:0 0 14px}
.stack .card:last-child{margin-bottom:0}
.stack .s{display:none}
.stack .card.tx .t{-webkit-line-clamp:3}

@container (max-width:600px){
  .row{--ih:calc(100cqw * .42)}
  .row>.card{flex:1 1 calc(50% - 16px)}
  .row.a>.card:nth-child(3){flex:1 1 calc(100% - 16px);flex-direction:row}
  .row.a>.card:nth-child(3) .im{width:50%;height:auto}
  .row.b>.stack{flex:1 1 calc(100% - 16px);flex-direction:row;flex-wrap:wrap}
  .row.b .stack .card{flex:1 1 40%;height:150px;margin:0 8px 8px}
  .row.c.tt .card{height:150px}
}

[data-density="compact"] .card{height:126px;margin-bottom:10px}
[data-density="compact"] .card .bd{padding:10px 14px;gap:4px}
[data-density="compact"] .card .t{font-size:14px}
[data-density="compact"] .card .s{font-size:12px;-webkit-line-clamp:2}
[data-density="compact"] .card .im{width:200px}
[data-density="compact"] .row .card .bd{height:130px}

/* ============ CHANNEL VIEW ============ */
.channel-list{
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--panel);
  overflow:hidden;
  margin-bottom:14px;
}
.ch-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;cursor:pointer;
  transition:background var(--t);
  font-size:14px;
}
.ch-row:last-child{border-bottom:0}
.ch-row:hover{background:var(--panel-2)}
.ch-row.read .ch-title{color:var(--text-dim)}
.ch-row.read .ch-dot{background:var(--mute);opacity:.4}
.ch-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--blue);flex:none;
}
.ch-src{
  font-size:11.5px;font-weight:600;color:var(--blue);
  flex:none;max-width:150px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ch-title{
  flex:1;min-width:0;
  font-size:14px;font-weight:500;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);
}
.ch-time{
  font-size:11px;color:var(--mute);
  flex:none;white-space:nowrap;
}
.ch-star{
  width:26px;height:26px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--mute);font-size:14px;line-height:1;
  background:transparent;border:0;cursor:pointer;
  opacity:0;transition:opacity var(--t),color var(--t),background var(--t);
  flex:none;
}
.ch-row:hover .ch-star{opacity:1}
.ch-star:hover{background:var(--panel-hover);color:var(--text)}
.ch-star.on{opacity:1;color:var(--star)}

.channel .feed h3{margin-top:26px}
.channel .feed h3:first-child{margin-top:4px}

@media(max-width:640px){
  .ch-src{display:none}
  .ch-time{font-size:10px}
  .ch-row{padding:10px 12px;gap:8px}
  .ch-title{font-size:13px}
}

.end{text-align:center;color:var(--mute);font-size:11px;letter-spacing:.14em;margin:56px 0 30px;text-transform:uppercase}
.end::before,.end::after{content:"";display:inline-block;width:40px;height:1px;background:var(--line);vertical-align:middle;margin:0 14px}

.rec3{display:flex;margin:0 -8px;gap:0}
.rtile{flex:1 1 0;min-width:0;margin:0 8px;height:120px;background:var(--panel) center/cover;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:0 12px;color:#fff;border:1px solid var(--line);text-shadow:0 1px 3px rgba(0,0,0,.6);transition:transform var(--t),box-shadow var(--t)}
.rtile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rtile .btn{text-shadow:none;font-size:11px;padding:5px 12px}

.empty{text-align:center;color:var(--mute);margin-top:100px;padding:0 20px}
.empty .big{font-size:34px;margin-bottom:12px;opacity:.5}
.empty h3{margin:0 0 6px;color:var(--text);font-size:17px;font-weight:600}
.empty p{margin:0;font-size:13px;line-height:1.6}

.skel{height:160px;margin-bottom:14px;border-radius:var(--radius);background:var(--skeleton);background-size:200% 100%;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{to{background-position:-200% 0}}

.add{max-width:780px;margin:30px auto}
.add h3{font-size:20px;font-weight:600;margin:0 0 6px}
.add .sub{color:var(--mute);font-size:13px;margin:0 0 22px}

.found{margin:14px 4px;font-size:13px}
.found .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
.found .row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.found .ok{color:var(--green)}
.found .err{color:var(--red)}
.found .meta{color:var(--mute);font-size:11.5px}

.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-top:22px;padding:16px 20px}
.box h4{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.rec .row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:var(--radius-sm);gap:12px;transition:background var(--t)}
.rec .row:hover{background:var(--panel-2)}
.rec .row small{color:var(--mute);font-size:11.5px}
.rec .row.added{opacity:.55}
.rec .row .name{font-weight:500}

.lnk{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px}
.lnk:hover{background:var(--blue-soft)}

.btn{background:var(--blue);color:#fff;border:0;padding:8px 18px;cursor:pointer;font-size:13px;font-weight:500;border-radius:8px;transition:background var(--t),transform var(--t),box-shadow var(--t)}
.btn:hover{background:var(--blue-2);box-shadow:0 4px 14px rgba(77,163,255,.3)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel-2);color:var(--text)}
.btn.ghost:hover{background:var(--panel-hover);box-shadow:none}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#e6394f}

.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.set{margin-top:26px;font-size:12px;color:var(--mute);line-height:1.6}
.set label{display:block;margin-top:14px;color:var(--text-dim);font-weight:500;margin-bottom:5px}
.set input,.set select{width:100%;background:var(--bg-soft);border:1px solid var(--line-2);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;outline:none;transition:border-color var(--t),box-shadow var(--t)}
.set input:focus,.set select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.set .switch{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--text-dim);font-weight:500;cursor:pointer;user-select:none}
.set .switch input{width:auto;margin:0}

.font-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.font-picker button{text-align:start;padding:10px 12px;border-radius:8px;cursor:pointer;background:var(--bg-soft);border:1px solid var(--line-2);color:var(--text);font-size:13px;transition:all var(--t);font-family:var(--font-app);display:flex;flex-direction:column;gap:4px}
.font-picker button:hover{border-color:var(--blue)}
.font-picker button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px var(--blue-soft)}
.font-picker button .fp-name{font-weight:600;font-size:13px}
.font-picker button .fp-sample{font-size:11px;color:var(--mute);line-height:1.4}
@media(max-width:520px){.font-picker{grid-template-columns:1fr}}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line-2);border-radius:var(--radius);width:min(580px,92vw);padding:0;box-shadow:var(--shadow);animation:dlgIn .22s ease both}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dlg-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-head h3{margin:0;font-size:16px;font-weight:600}
.dlg-head .close{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:16px;line-height:1}
.dlg-head .close:hover{background:var(--panel-2);color:var(--text)}
.dlg-body{padding:18px 22px;max-height:70vh;overflow:auto}
.dlg-body ul{padding-inline-start:18px;margin:0}
.dlg-body li{margin:8px 0;line-height:1.5}
.dlg-body a{color:var(--text);text-decoration:none;border-bottom:1px solid transparent}
.dlg-body a:hover{color:var(--blue);border-color:var(--blue)}
.dlg-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--line-2);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:100;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red)}

#reader{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;animation:rdIn .22s ease both}
#reader[hidden]{display:none}
@keyframes rdIn{from{opacity:0}to{opacity:1}}
.rd-bar{flex:none;position:relative;display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;background:var(--header-bg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.rd-back{width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--text);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background var(--t),transform var(--t)}
.rd-back:hover{background:var(--panel-2)}
html[dir="rtl"] .rd-back{transform:scaleX(-1)}
.rd-title-bar{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.rd-src{font-size:12px;color:var(--blue);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-time{font-size:11px;color:var(--mute)}
.rd-actions{display:flex;gap:4px;flex:none;align-items:center}
.rd-font-wrap{position:relative}
.rd-font-btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background var(--t),border-color var(--t)}
.rd-font-btn:hover{background:var(--panel-2);border-color:var(--blue)}
.rd-font-btn .caret{font-size:9px;color:var(--mute)}
.rd-font-menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:10;display:none}
.rd-font-menu.open{display:block;animation:dlgIn .18s ease both}
.rd-font-menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:13px;text-align:start;transition:background var(--t)}
.rd-font-menu button:hover{background:var(--panel-2)}
.rd-font-menu button.on{background:var(--blue-soft);color:var(--blue)}
.rd-font-menu button .nm{font-weight:600}
.rd-font-menu button .prev{font-size:11px;color:var(--mute)}
.rd-btn{height:32px;min-width:32px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background var(--t),color var(--t)}
.rd-btn:hover{background:var(--panel-2);color:var(--text)}
.rd-progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent;overflow:hidden}
.rd-progress-fill{height:100%;width:0;background:var(--blue);transition:width .1s linear}
.rd-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.rd-content{max-width:720px;margin:0 auto;padding:36px 24px 100px;font-family:var(--font-reader);font-size:var(--rd-size);line-height:1.9;color:var(--text)}
.rd-content .rd-hero{width:100%;aspect-ratio:16/9;border-radius:var(--radius);background:var(--panel-2) center/cover;margin-bottom:22px}
.rd-content h1.rd-h1{font-size:calc(var(--rd-size) * 1.7);line-height:1.4;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
.rd-content .rd-byline{color:var(--mute);font-size:13px;margin-bottom:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rd-content .rd-byline .dot{width:4px;height:4px;border-radius:50%;background:var(--mute);display:inline-block}
.rd-content h2,.rd-content h3,.rd-content h4{line-height:1.5;margin:1.7em 0 .5em;letter-spacing:-.01em}
.rd-content h2{font-size:calc(var(--rd-size) * 1.35)}
.rd-content h3{font-size:calc(var(--rd-size) * 1.15)}
.rd-content p{margin:0 0 1.2em}
.rd-content img{max-width:100%;height:auto;border-radius:8px;margin:.6em 0;display:block}
.rd-content figure{margin:1.4em 0}
.rd-content figcaption{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
.rd-content a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(77,163,255,.35)}
.rd-content a:hover{border-bottom-color:var(--blue)}
.rd-content blockquote{margin:1.2em 0;padding:6px 18px;border-inline-start:3px solid var(--blue);color:var(--text-dim);font-style:italic}
.rd-content pre,.rd-content code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.9em}
.rd-content pre{background:var(--panel);padding:14px 16px;border-radius:8px;overflow-x:auto;border:1px solid var(--line);direction:ltr;text-align:left}
.rd-content code{background:var(--panel-2);padding:2px 6px;border-radius:4px;direction:ltr;unicode-bidi:embed}
.rd-content pre code{background:none;padding:0}
.rd-content ul,.rd-content ol{padding-inline-start:1.4em;margin:0 0 1.2em}
.rd-content li{margin:.4em 0}
.rd-content hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.rd-content table{width:100%;border-collapse:collapse;margin:1em 0}
.rd-content th,.rd-content td{padding:8px 12px;border:1px solid var(--line);text-align:start}
.rd-content th{background:var(--panel-2)}
.rd-content[dir="rtl"] pre,
.rd-content[dir="rtl"] code,
.rd-content[dir="rtl"] pre *,
.rd-content[dir="rtl"] code *{direction:ltr;text-align:left;unicode-bidi:embed}
.rd-loading{text-align:center;color:var(--mute);padding:80px 20px;font-size:14px}
.rd-loading::after{content:"";display:block;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:18px auto 0;animation:spin .8s linear infinite}
.rd-end{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);text-align:center}
.rd-end .btn{margin:0 4px}

@media(max-width:820px){
  aside{display:none}
  main{padding-block:18px 60px;padding-inline:16px}
  .card .im{width:130px}
  .card{height:140px}
  .card .s{-webkit-line-clamp:2}
  .search-wrap{max-width:none}
  .rd-content{padding:24px 18px 80px;line-height:1.85}
  .rd-content h1.rd-h1{font-size:calc(var(--rd-size) * 1.5)}
  .rd-time{display:none}
}
[dir=auto]{unicode-bidi:plaintext}

<body>
<header>
  <div class="brand">
    <div class="logo"></div>
    <h1 id="appTitle">Personal news</h1>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" class="search" placeholder="" autocomplete="off" spellcheck="false">
    <button class="search-clear" id="searchClear" hidden aria-label="">✕</button>
  </div>
  <div class="head-actions">
    <button class="icon-btn" id="refreshBtn" aria-label="">⟳</button>
    <button class="icon-btn" id="themeBtn" aria-label="">◐</button>
    <button class="icon-btn" id="settingsBtn" aria-label="">⚙</button>
  </div>
</header>

<div class="layout">
  <aside id="side"></aside>
  <main>
    <div class="top">
      <div class="title-wrap">
        <h2 id="ttl"></h2>
        <span class="count" id="cnt"></span>
      </div>
      <div class="tact">
        <div class="seg" id="sortSeg">
          <button data-sort="newest" id="sortNewest">↓</button>
          <button data-sort="oldest" id="sortOldest">↑</button>
        </div>
        <div class="seg" id="densSeg">
          <button data-dens="cozy" id="densCozy">▦</button>
          <button data-dens="compact" id="densCompact">▤</button>
        </div>
        <div class="seg" id="tg">
          <button data-v="list" id="tgList">☰</button>
          <button data-v="channel" id="tgChannel">≡</button>
          <button data-v="grid" id="tgGrid">▩</button>
        </div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="reader" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="rd-bar">
    <button class="rd-back" id="rdBack" aria-label="">←</button>
    <div class="rd-title-bar">
      <div class="rd-src" id="rdSrc"></div>
      <div class="rd-time" id="rdTime"></div>
    </div>
    <div class="rd-actions">
      <div class="rd-font-wrap">
        <button class="rd-font-btn" id="rdFontBtn">
          <span id="rdFontLabel">Sahel</span><span class="caret">▼</span>
        </button>
        <div class="rd-font-menu" id="rdFontMenu"></div>
      </div>
      <button class="rd-btn" id="rdFontDec" aria-label="">A−</button>
      <button class="rd-btn" id="rdFontInc" aria-label="">A+</button>
      <button class="rd-btn" id="rdStar" aria-label="">★</button>
      <button class="rd-btn" id="rdOpen" aria-label="">↗</button>
    </div>
    <div class="rd-progress"><div class="rd-progress-fill" id="rdProgress"></div></div>
  </div>
  <div class="rd-scroll" id="rdScroll">
    <div class="rd-content" id="rdContent" dir="ltr"></div>
  </div>
</div>

<dialog id="previewDlg">
  <div class="dlg-head"><h3 id="pvTitle"></h3><button class="close" data-close>✕</button></div>
  <div class="dlg-body" id="pvBody"></div>
  <div class="dlg-foot"><button class="btn ghost" data-close id="pvCloseBtn"></button></div>
</dialog>

<dialog id="settingsDlg">
  <div class="dlg-head"><h3 id="setTitle"></h3><button class="close" data-close>✕</button></div>
  <div class="dlg-body" id="setBody"></div>
  <div class="dlg-foot"><button class="btn" data-close id="setDone"></button></div>
</dialog>

/* ============ Number formatting ============ */
const FA_DIGITS = "۰۱۲۳۴۵۶۷۸۹";
function toFaNum(v){
  return String(v).replace(/\d/g, d => FA_DIGITS[+d]);
}
function formatNum(v){
  return appLang === "fa" ? toFaNum(v) : String(v);
}

function t(key, vars){
  const lang = LANGS[appLang] || LANGS.en;
  let s = lang[key] ?? LANGS.en[key] ?? key;
  if (vars && typeof s === "string"){
    for (const k in vars){
      const raw = vars[k];
      const val = (appLang === "fa" && typeof raw === "number") ? toFaNum(raw) : String(raw);
      s = s.replace("{" + k + "}", val);

  }

}

/* ============ Networking ============ */
const customProxy = () => store.get("proxy", "");
function proxies(){
  const list = [u => u,
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?" + encodeURIComponent(u)];
  const c = customProxy();
  if (c) list.unshift(u => c.includes("{url}") ? c.replace("{url}", encodeURIComponent(u)) : c + u);
  return list;
}
async function fetchText(url, ms = 9000){
  let lastErr;
  for (const p of proxies()){
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(p(url), {signal: ctl.signal});
      clearTimeout(t);
      if (r.ok) return await r.text();
      lastErr = new Error("HTTP " + r.status);
    } catch (e) { clearTimeout(t); lastErr = e; }
  }
  throw lastErr || new Error("Network error");
}
function proxyImageUrls(url){
  const out = [];
  const c = customProxy();
  if (c) out.push(c.includes("{url}") ? c.replace("{url}", encodeURIComponent(url)) : c + url);
  out.push("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
  out.push("https://corsproxy.io/?" + encodeURIComponent(url));
  return out;
}

/* ============ URL / direction ============ */
function resolveImgUrl(src, base){
  if (!src) return "";
  src = String(src).trim();
  if (!src) return "";
  if (/^(data|blob):/i.test(src)) return src;
  if (src.startsWith("//")) src = location.protocol + src;
  try {
    const u = new URL(src, base || location.href);
    if (u.protocol === "http:" && location.protocol === "https:") u.protocol = "https:";
    return u.href;
  } catch { return src; }
}
function isRtlChar(cp){
  return (cp >= 0x0590 && cp <= 0x05FF) || (cp >= 0x0600 && cp <= 0x06FF) ||
         (cp >= 0x0700 && cp <= 0x074F) || (cp >= 0x0750 && cp <= 0x077F) ||
         (cp >= 0x08A0 && cp <= 0x08FF) || (cp >= 0xFB1D && cp <= 0xFDFF) ||
         (cp >= 0xFE70 && cp <= 0xFEFF);
}
function isLtrChar(cp){
  return (cp >= 0x0041 && cp <= 0x005A) || (cp >= 0x0061 && cp <= 0x007A) ||
         (cp >= 0x00C0 && cp <= 0x024F);
}
function detectDirection(text){
  if (!text) return "ltr";
  let rtl = 0, ltr = 0;
  for (const ch of text){
    const cp = ch.codePointAt(0);
    if (isRtlChar(cp)) rtl++;
    else if (isLtrChar(cp)) ltr++;
  }
  if (rtl === 0) return "ltr";
  return rtl >= ltr * 0.6 ? "rtl" : "ltr";
}

/* ============ Parsing ============ */
function parseFeed(text){
  const doc = new DOMParser().parseFromString(text.trim(), "text/xml");
  if (doc.querySelector("parsererror")) return null;
  const root = doc.documentElement, name = root.localName.toLowerCase();
  const txt = (el, tag) => { const n = el && [...el.children].find(c => c.localName === tag); return n ? n.textContent.trim() : ""; };
  const all = (el, tag) => [...el.getElementsByTagNameNS("*", tag)];
  const collectImgs = (html, base) => {
    const out = [];
    for (const m of (html || "").matchAll(/<img[^>]+src=["']([^"']+)["']/gi)){
      const u = resolveImgUrl(m[1], base);
      if (u && !out.includes(u)) out.push(u);
    }
    return out;
  };
  if (name === "rss" || name === "rdf"){
    const ch = root.querySelector("channel") || root;
    const items = [...doc.getElementsByTagNameNS("*", "item")].map(it => {
      const html = txt(it, "encoded") || txt(it, "description");
      const link = txt(it, "link") || txt(it, "guid");
      const enc = [...it.children].find(c => c.localName === "enclosure" && /image/.test(c.getAttribute("type") || ""));
      const media = all(it, "thumbnail")[0] || all(it, "content").find(c => /image/.test(c.getAttribute("type") || c.getAttribute("medium") || ""));
      const cands = [];
      const push = u => { const r = resolveImgUrl(u, link); if (r && !cands.includes(r)) cands.push(r); };
      if (enc && enc.getAttribute("url")) push(enc.getAttribute("url"));
      if (media && media.getAttribute("url")) push(media.getAttribute("url"));
      collectImgs(html, link).forEach(push);
      return {title: txt(it, "title"), link, date: Date.parse(txt(it, "pubDate") || txt(it, "date")) || 0, html, img: cands[0] || "", imgCandidates: cands};
    });
    return {kind: "RSS", title: txt(ch, "title"), items};
  }
  if (name === "feed"){
    const items = [...doc.getElementsByTagNameNS("*", "entry")].map(it => {
      const links = [...it.children].filter(c => c.localName === "link");
      const l = links.find(x => (x.getAttribute("rel") || "alternate") === "alternate") || links[0];
      const link = l ? l.getAttribute("href") : "";
      const html = txt(it, "content") || txt(it, "summary");
      const media = all(it, "thumbnail")[0];
      const cands = [];
      const push = u => { const r = resolveImgUrl(u, link); if (r && !cands.includes(r)) cands.push(r); };
      if (media && media.getAttribute("url")) push(media.getAttribute("url"));
      collectImgs(html, link).forEach(push);
      return {title: txt(it, "title"), link, date: Date.parse(txt(it, "published") || txt(it, "updated")) || 0, html, img: cands[0] || "", imgCandidates: cands};
    });
    return {kind: "Atom", title: txt(root, "title"), items};
  }
  return null;
}
function plain(html){
  const d = new DOMParser().parseFromString(html || "", "text/html");
  return (d.body.textContent || "").replace(/\s+/g, " ").trim();
}
/* جهت هر خبر را از محتوای خودش تشخیص میدهد (نه از زبان محیط) */
function itemDir(a){
  if (a.dir) return a.dir;
  const sample = (a.title || "") + " " + plain(a.html || "").slice(0, 300);
  a.dir = detectDirection(sample);
  return a.dir;
}

/* ============ Discovery ============ */
const looksFeed = t => /<(rss|feed|rdf:RDF)[\s>]/i.test(t.slice(0, 3000));
function normalizeUrl(s){
  s = s.trim();
  if (!s || /\s/.test(s) || !s.includes(".")) return null;
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try { return new URL(s).href } catch { return null }
}
async function probe(url){
  try {
    const t = await fetchText(url, 7000);
    if (!looksFeed(t)) return null;
    const f = parseFeed(t);
    return f ? {url, title: f.title || new URL(url).hostname, kind: f.kind, count: f.items.length} : null;
  } catch { return null }
}
async function discover(input, onStep){
  const url = normalizeUrl(input);
  if (!url) return [];
  const found = new Map();
  const add = r => r && !found.has(r.url) && found.set(r.url, r);
  onStep(t("checkingPage"));
  let html = "";
  try { html = await fetchText(url); } catch {}
  if (html && looksFeed(html)) {
    const f = parseFeed(html);
    if (f) return [{url, title: f.title || new URL(url).hostname, kind: f.kind, count: f.items.length}];
  }
  if (html){
    const d = new DOMParser().parseFromString(html, "text/html");
    const base = d.querySelector("base[href]") ? new URL(d.querySelector("base").getAttribute("href"), url).href : url;
    const cands = [...d.querySelectorAll('link[rel~="alternate"][href]')]
      .filter(l => /(rss|atom)\+xml|application\/(xml|feed)|text\/xml/i.test(l.type || ""))
      .map(l => { try { return new URL(l.getAttribute("href"), base).href } catch { return null } })
      .filter(Boolean);
    const anchors = [...d.querySelectorAll("a[href]")].map(a => a.getAttribute("href"))
      .filter(h => /(^|\/)(feed|rss|atom)(\/|\.xml|\.rss|$)|\.(rss|atom)$/i.test(h))
      .map(h => { try { return new URL(h, base).href } catch { return null } }).filter(Boolean);
    onStep(t("verifyingFeeds", {n: cands.length}));
    const res = await Promise.all([...new Set([...cands, ...anchors])].slice(0, 8).map(probe));
    res.forEach(add);
  }
  if (!found.size){
    const u = new URL(url), bases = new Set([u.origin]);
    if (u.pathname.length > 1) bases.add(u.origin + u.pathname.replace(/\/$/, ""));
    const tries = [];
    bases.forEach(b => COMMON_PATHS.forEach(p => tries.push(b + p)));
    onStep(t("tryingPaths"));
    for (let i = 0; i < tries.length && !found.size; i += 6){
      (await Promise.all(tries.slice(i, i + 6).map(probe))).forEach(add);
    }
  }
  return [...found.values()];
}

/* ============ Images ============ */
const cssUrl = u => "url('" + String(u).replace(/['()\s]/g, c => "%" + c.charCodeAt(0).toString(16)) + "')";
const ic = store.get("ic", {}); let icT;
function icSave(){

let active = 0; const waiting = [];
const limit = fn => new Promise(r => {
  const run = async () => {
    active++;
    try { r(await fn()); }
    finally { active--; waiting.length && waiting.shift()(); }
  };
  active < 6 ? run() : waiting.push(run);
});
function probeImg(u, {useReferrer = false, timeout = 8000} = {}){
  return new Promise(res => {
    if (!u) return res(false);
    const i = new Image();
    if (!useReferrer) i.referrerPolicy = "no-referrer";
    i.decoding = "async";
    const t = setTimeout(() => res(false), timeout);
    i.onload = () => { clearTimeout(t); res(i.naturalWidth >= 300 && i.naturalHeight >= 160); };
    i.onerror = () => { clearTimeout(t); res(false); };
    i.src = u;
  });
}
async function ogImage(link){
  try {
    const d = new DOMParser().parseFromString(await fetchText(link, 7000), "text/html");
    const m = d.querySelector('meta[property="og:image"],meta[name="og:image"],meta[name="twitter:image"],meta[property="twitter:image"],meta[itemprop="image"]');
    return m && m.content ? resolveImgUrl(m.content, link) : "";
  } catch { return "" }
}
let rt; const soon = () => { clearTimeout(rt); rt = setTimeout(() => (state.page === "news" || state.page === "saved") ? render() : renderSide(), 350); };

function patchCard(a){
  const el = document.querySelector('.card[data-link="' + cssEsc(a.link) + '"]');
  if (!el) return false;
  const isM = el.classList.contains("m");
  const wantM = !!a.ok;
  if (isM !== wantM) return false;
  if (wantM){
    const im = el.querySelector(".im");
    if (im){
      const bg = cssUrl(a.img);
      if (im.style.backgroundImage !== bg) im.style.backgroundImage = bg;
    }
  }
  return true;
}
async function resolveItem(a){
  if (a.done) return;
  const c = ic[a.link];
  if (c){
    a.img = c.img; a.ok = c.ok; a.done = true;
    if (!patchCard(a)) soon();
    return;
  }
  const rawCands = Array.isArray(a.imgCandidates) && a.imgCandidates.length ? a.imgCandidates.slice() : (a.img ? [a.img] : []);
  const cands = [...new Set(rawCands.map(u => resolveImgUrl(u, a.link)).filter(Boolean))];
  const primary = cands[0] || "";
  let ok = false;
  if (primary) ok = await limit(() => probeImg(primary, {useReferrer: false, timeout: 5000}));
  a.img = primary;
  a.ok = ok;
  a.done = true;
  if (ok){ ic[a.link] = {img: a.img, ok: true}; icSave(); }
  if (!patchCard(a)) soon();
  if (ok) return;
  (async () => {
    let url = primary, got = false;
    if (primary) got = await limit(() => probeImg(primary, {useReferrer: true, timeout: 6000}));
    if (!got){
      for (let i = 1; i < cands.length; i++){
        const u = cands[i];
        if (await limit(() => probeImg(u, {useReferrer: false, timeout: 6000}))){ url = u; got = true; break; }
        if (await limit(() => probeImg(u, {useReferrer: true, timeout: 5000}))){ url = u; got = true; break; }
      }
    }
    if (!got){
      const o = await limit(() => ogImage(a.link));
      if (o && !cands.includes(o)){
        if (await limit(() => probeImg(o, {useReferrer: false, timeout: 7000}))){ url = o; got = true; }
      }
    }
    if (!got && url){
      for (const p of proxyImageUrls(url).slice(0, 2)){
        if (await limit(() => probeImg(p, {useReferrer: false, timeout: 9000}))){ url = p; got = true; break; }
      }
    }
    if (got){ a.img = url; a.ok = true; ic[a.link] = {img: a.img, ok: true}; }
    else { ic[a.link] = {img: a.img, ok: false}; }
    icSave();
    if (got && !patchCard(a)) soon();
  })();
}

/* ============ Helpers ============ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escAttr = esc;
function ago(ts){
  if (!ts) return "";
  const m = Math.max(1, Math.round((Date.now() - ts) / 60000));
  if (m < 60) return t("minAgo", {n: m});
  const h = Math.round(m / 60); if (h < 24) return t("hourAgo", {n: h});
  const d = Math.round(h / 24); if (d < 30) return t("dayAgo", {n: d});
  return t("monthAgo", {n: Math.round(d / 30)});
}
function group(ts){
  const age = Date.now() - ts, day = new Date(); day.setHours(0,0,0,0);
  if (age < 3 * 3600e3) return t("groupRecent");
  if (ts >= day.getTime()) return t("groupToday");
  if (ts >= day.getTime() - 864e5) return t("groupYesterday");
  if (ts >= day.getTime() - 7 * 864e5) return t("groupThisWeek");
  if (ts >= day.getTime() - 14 * 864e5) return t("groupLastWeek");
  return t("groupEarlier");
}
function readingTime(html){
  const words = plain(html).split(/\s+/).length;
  const min = Math.max(1, Math.round(words / 220));
  return words > 40 ? min : 0;
}
function toast(msg, kind = ""){

  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));

}

function buildReaderFontMenu(){
  const menu = $("#rdFontMenu");

  }).join("");

/* ============ Article extraction ============ */
const ALLOWED_TAGS = new Set(["P","H1","H2","H3","H4","H5","H6","UL","OL","LI","BLOCKQUOTE","PRE","CODE","A","IMG","FIGURE","FIGCAPTION","EM","STRONG","B","I","U","BR","HR","TABLE","THEAD","TBODY","TR","TD","TH","SPAN","DIV","SUP","SUB","MARK","TIME","CITE","SMALL"]);
const ALLOWED_ATTRS = new Set(["href","src","alt","title","colspan","rowspan","width","height","loading"]);
function sanitizeTree(node, baseUrl){
  if (node.nodeType === 1){
    if (!ALLOWED_TAGS.has(node.tagName)){
      const frag = document.createDocumentFragment();
      while (node.firstChild) frag.appendChild(node.firstChild);
      node.replaceWith(frag);
      return;
    }
    for (const attr of [...node.attributes]){
      const name = attr.name.toLowerCase();
      if (name === "class" || name === "id" || name === "style"){ node.removeAttribute(attr.name); continue; }
      if (!ALLOWED_ATTRS.has(name)){ node.removeAttribute(attr.name); continue; }
      const v = attr.value.trim();
      if (name === "href" || name === "src"){
        if (/^javascript:/i.test(v) || /^data:(?!image\/)/i.test(v) || /^vbscript:/i.test(v)){ node.removeAttribute(attr.name); continue; }
        if (!/^(https?:|mailto:|#|\/)/i.test(v)){
          try { node.setAttribute(attr.name, new URL(v, baseUrl).href); }
          catch { node.removeAttribute(attr.name); }
        }
      }
    }
    if (node.tagName === "A" && node.getAttribute("href")){
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
    for (const child of [...node.childNodes]) sanitizeTree(child, baseUrl);
  } else if (node.nodeType === 11 || node.nodeType === 9){
    for (const child of [...node.childNodes]) sanitizeTree(child, baseUrl);
  }
}
function extractArticle(html, url){
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  const metaSel = (sel) => {
    const el = doc.querySelector(sel);
    return el ? (el.content || el.getAttribute("content") || el.textContent || "").trim() : "";
  };
  const meta = {
    title: metaSel('meta[property="og:title"]') || metaSel('meta[name="twitter:title"]') || (doc.querySelector("title") ? doc.querySelector("title").textContent.trim() : ""),
    image: resolveImgUrl(metaSel('meta[property="og:image"]') || metaSel('meta[name="twitter:image"]') || "", url),
    description: metaSel('meta[property="og:description"]') || metaSel('meta[name="description"]') || metaSel('meta[name="twitter:description"]') || "",
    siteName: metaSel('meta[property="og:site_name"]') || "",
    htmlLang: (doc.documentElement.getAttribute("lang") || "").toLowerCase(),
    htmlDir: (doc.documentElement.getAttribute("dir") || "").toLowerCase()
  };
  doc.querySelectorAll('script,style,noscript,iframe,form,nav,header,footer,aside,svg,button,input,select,textarea,[role="navigation"],[role="banner"],[role="complementary"],[role="contentinfo"],[aria-hidden="true"],.ad,.ads,.advert,.share,.social,.comments,.sidebar,.menu,.nav').forEach(n => n.remove());
  const score = el => {
    if (!el || !el.textContent) return 0;
    const text = el.textContent.trim();
    const len = text.length;
    if (len < 120) return 0;
    const linkLen = [...el.querySelectorAll("a")].reduce((n, a) => n + (a.textContent || "").length, 0);
    const linkDensity = len ? linkLen / len : 1;
    const commas = (text.match(/[,،.]/g) || []).length;
    const ps = el.querySelectorAll("p").length;
    const imgs = el.querySelectorAll("img").length;
    return len * (1 - linkDensity) + commas * 20 + ps * 40 + imgs * 25;
  };
  const seeds = [...doc.querySelectorAll('article, main, [role="main"], .post, .article, .entry-content, .post-content, .article-content, .article-body, #content, #main, .content, [itemprop="articleBody"]')];
  let best = null, bestScore = 0;
  for (const el of seeds){
    const s = score(el);
    if (s > bestScore){ best = el; bestScore = s; }
  }
  if (!best){
    for (const el of doc.querySelectorAll("div, section")){
      const s = score(el);
      if (s > bestScore){ best = el; bestScore = s; }
    }
  }
  if (!best) best = doc.body;
  const clone = best.cloneNode(true);
  clone.querySelectorAll("div:empty, p:empty, span:empty").forEach(n => n.remove());
  clone.querySelectorAll("img").forEach(img => {
    let src = img.getAttribute("src") || img.getAttribute("data-src") || img.getAttribute("data-lazy-src") || img.getAttribute("data-original") || "";
    if (!src){ img.remove(); return; }
    src = resolveImgUrl(src, url);
    img.setAttribute("src", src);
    img.setAttribute("loading", "lazy");
    img.removeAttribute("srcset");
    img.removeAttribute("sizes");
  });
  sanitizeTree(clone, url);
  const contentText = (clone.textContent || "").replace(/\s+/g, " ").trim();
  let direction = "";
  if (meta.htmlDir === "rtl") direction = "rtl";
  else if (meta.htmlDir === "ltr") direction = "ltr";
  else if (/^(fa|ar|he|ur|ckb|ps|sd|ug|yi|dv)(-|$)/.test(meta.htmlLang)) direction = "rtl";
  else direction = detectDirection(meta.title + " " + contentText);
  return {title: meta.title, image: meta.image, description: meta.description, siteName: meta.siteName, contentHTML: clone.innerHTML, contentText, direction};
}

/* ============ Prefetch ============ */
const prefetchCache = new Map();
const PREFETCH_MAX = 40;
function prefetch(link){
  if (prefetchCache.has(link)){
    const entry = prefetchCache.get(link);
    prefetchCache.delete(link); prefetchCache.set(link, entry);
    return entry.promise;
  }
  const entry = {};
  entry.promise = (async () => {
    const html = await fetchText(link, 12000);
    entry.article = extractArticle(html, link);
    return entry.article;
  })().catch(err => { entry.error = err; throw err; });
  prefetchCache.set(link, entry);
  if (prefetchCache.size > PREFETCH_MAX){
    const first = prefetchCache.keys().next().value;
    prefetchCache.delete(first);
  }
  return entry.promise;
}
let hoverTimer = null, hoverLink = null;
function schedulePrefetch(link){
  if (!prefetchOn) return;
  if (prefetchCache.has(link)){ prefetchCache.get(link).promise.catch(() => {}); return; }
  clearTimeout(hoverTimer);
  hoverLink = link;
  hoverTimer = setTimeout(() => { if (hoverLink === link) prefetch(link).catch(() => {}); }, 200);
}
function cancelPrefetch(){ clearTimeout(hoverTimer); hoverLink = null; }
document.addEventListener("mouseover", e => {
  const c = e.target.closest(".card[data-link], .ch-row[data-link]");
  if (c) schedulePrefetch(c.dataset.link);
}, true);
document.addEventListener("mouseout", e => {
  const c = e.target.closest(".card[data-link], .ch-row[data-link]");
  if (c) cancelPrefetch();
}, true);
document.addEventListener("touchstart", e => {
  const c = e.target.closest(".card[data-link], .ch-row[data-link]");
  if (c && prefetchOn) prefetch(c.dataset.link).catch(() => {});
}, {passive: true});

/* ============ Reader mode ============ */
const b64urlEncode = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const b64urlDecode = s => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};
function findItem(link){
  for (const url in articles){
    const it = articles[url].find(a => a.link === link);
    if (it) return it;
  }
  return saved.find(s => s.link === link) || null;
}
let readerCurrentLink = null;
function openReader(link){

     <div class="rd-byline">${item && item.source ? `<span>${esc(item.source)}</span>` : ""}${dateStr ? `<span class="dot"></span><span>${esc(dateStr)}</span>` : ""}${rtm ? `<span class="dot"></span><span>${esc(t("minReadLong", {n: rtm}))}</span>` : ""}</div>
     <div class="rd-body">${art.contentHTML}</div>

/* ============ Render: Mosaic ============ */
function mosaic(items){
  const h = l => l.map(cardHtml).join("");
  const takeB = i => {
    const M = [], T = []; let j = i;
    while (j < items.length){
      const a = items[j];
      if (a.ok){ if (M.length === 2) break; M.push(a); } else { if (T.length === 3) break; T.push(a); }
      j++;
    }
    return M.length === 2 && T.length ? {M, T, n: j - i} : null;
  };
  const isA = i => items[i] && items[i].ok && items[i + 1] && items[i + 1].ok && items[i + 2] && items[i + 2].ok;
  let out = "", i = 0, useB = false;
  while (i < items.length){
    const B = takeB(i);
    if (useB && B){
      out += `<div class="row b">${h(B.M)}<div class="stack">${h(B.T)}</div></div>`; i += B.n; useB = false;
    } else if (isA(i)){
      out += `<div class="row a">${h(items.slice(i, i + 3))}</div>`; i += 3; useB = true;
    } else if (B){
      out += `<div class="row b">${h(B.M)}<div class="stack">${h(B.T)}</div></div>`; i += B.n; useB = false;
    } else if (items[i].ok && items[i + 1] && items[i + 1].ok && !(items[i + 2] && !items[i + 2].ok)){
      out += `<div class="row d">${h(items.slice(i, i + 2))}</div>`; i += 2;
    } else if (!items[i].ok){
      let j = i; while (j < items.length && !items[j].ok && j - i < 6) j++;
      out += `<div class="row c tt">${h(items.slice(i, j))}</div>`; i = j;
    } else {
      const part = items.slice(i, i + 4);
      out += `<div class="row c ${part.some(a => a.ok) ? "" : "tt"}">${h(part)}</div>`; i += part.length;
    }
  }
  return out;
}

      out += `<div class="end">${esc(t("endOfStream"))}</div><h3>${esc(t("recommended"))}</h3><div class="rec3">` +
        recs.map(c => `<div class="rtile" data-u="${esc(c.url)}" data-recycle="rtile:${appLang}:${esc(c.url)}"><span>${esc(c.title)}</span><button class="btn" data-addrec="${esc(c.url)}">${esc(t("add"))}</button></div>`).join("") + `</div>`;
    }
  }
  return out + `</div>`;
}
const recImg = {};
function hydrateRec(){
  if (viewMode === "channel") return;   /* no tiles in channel mode */
  $$(".rtile").forEach(async el => {
    const u = el.dataset.u;
    if (!(u in recImg)) recImg[u] = (async () => {
      try { const f = parseFeed(await fetchText(u)); const it = f.items.find(i => i.imgCandidates && i.imgCandidates.length); return it ? it.imgCandidates[0] : ""; }
      catch { return "" }
    })();
    const img = await recImg[u];
    if (!img || !el.isConnected) return;
    const bg = "linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.75))," + cssUrl(img);
    if (el.style.backgroundImage !== bg) el.style.backgroundImage = bg;
  });
}

/* ============ Render: Add sources ============ */
function renderAddHTML(){
  const rec = CATALOG.map(c => {
    const has = sources.some(s => s.url === c.url);
    return `<div class="row ${has?"added":""}">
      <span><span class="name">${esc(c.title)}</span> <small>— ${esc(new URL(c.url).hostname.replace(/^www\./,""))}</small></span>
      <span>${has ? `<span class="meta" style="color:var(--green)">✓ ${esc(t("added"))}</span>` :
        `<button class="lnk" data-prev="${esc(c.url)}">${esc(t("preview"))}</button>
         <button class="lnk" data-addrec="${esc(c.url)}">${esc(t("add"))}</button>`}</span>
    </div>`;
  }).join("");
  return `<div class="add">
    <h3>${esc(t("addSourceTitle"))}</h3>
    <p class="sub">${esc(t("addSourceSubtitle"))}</p>
    <input id="q" class="search" style="padding-inline:16px" placeholder="${esc(t("addSourcePlaceholder"))}" autocomplete="off" spellcheck="false">
    <div class="found" id="found"></div>
    <div class="box rec"><h4>${esc(t("recommended"))}</h4>${rec}
      <div class="actions"><button class="btn" data-go="news">${esc(t("startReading"))}</button></div>
    </div>
    <div class="set">
      <label>${esc(t("proxyLabel"))}</label>
      ${esc(t("proxyHelp"))}
      <input id="proxy" placeholder="${esc(t("proxyPlaceholder"))}" value="${esc(customProxy())}" style="margin-top:6px">
    </div>
  </div>`;
}

/* ============ Settings dialog ============ */
function fillSettings(){
  $("#setTitle").textContent = t("settingsTitle");
  $("#setDone").textContent = t("done");
  const fontPicker = FONTS.map(f => {
    const primary = appLang === "fa" ? f.labelFa : f.label;
    const secondary = appLang === "fa" ? f.label : f.labelFa;
    const def = f.id === "sahel" ? ` — ${esc(t("fontDefault"))}` : "";
    return `<button data-f="${f.id}" class="${f.id === fontId ? "on" : ""}">
      <span class="fp-name" style="font-family:${f.family}">${esc(primary)}</span>
      <span class="fp-sample">${esc(secondary)}${def}</span>
    </button>`;
  }).join("");
  const langPicker = Object.entries(LANGS).map(([id, l]) =>
    `<button data-lang="${id}" class="${id === appLang ? "on" : ""}">
      <span class="fp-name">${esc(l.nativeName)}</span>
      <span class="fp-sample">${esc(l.name)}</span>
    </button>`
  ).join("");
  $("#setBody").innerHTML = `
    <div class="set" style="margin-top:0">
      <label>${esc(t("language"))}</label>
      <div class="font-picker" id="langPicker">${langPicker}</div>

      <label>${esc(t("theme"))}</label>
      <select id="setTheme">
        <option value="dark" ${theme==="dark"?"selected":""}>${esc(t("themeDark"))}</option>
        <option value="light" ${theme==="light"?"selected":""}>${esc(t("themeLight"))}</option>
      </select>

      <label>${esc(t("font"))}</label>
      <div class="font-picker" id="fontPicker">${fontPicker}</div>

      <label for="setAuto">${esc(t("autoRefresh"))}</label>
      <input id="setAuto" type="number" min="0" max="180" step="5" value="${autoMin}">

      <label for="setProxy">${esc(t("proxyLabel"))}</label>
      <input id="setProxy" placeholder="${esc(t("proxyPlaceholder"))}" value="${esc(customProxy())}">

      <label class="switch"><input type="checkbox" id="setReader" ${openInReader?"checked":""}> ${esc(t("openInReader"))}</label>
      <label class="switch"><input type="checkbox" id="setPrefetch" ${prefetchOn?"checked":""}> ${esc(t("prefetch"))}</label>

      <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap">
        <button class="btn ghost" id="opmlExport">${esc(t("exportOpml"))}</button>
        <button class="btn ghost" id="opmlImport">${esc(t("importOpml"))}</button>
        <input type="file" id="opmlFile" accept=".opml,.xml" hidden>
        <button class="btn ghost" id="imgCacheClear">${esc(t("clearImgCache"))}</button>
        <button class="btn danger" id="resetAll" style="margin-inline-start:auto">${esc(t("resetAll"))}</button>
      </div>
    </div>`;
  $("#langPicker").addEventListener("click", e => {
    const b = e.target.closest("button[data-lang]");
    if (b) setLang(b.dataset.lang);
  });
  $("#fontPicker").addEventListener("click", e => {
    const b = e.target.closest("button[data-f]");
    if (b){ setFont(b.dataset.f); fillSettings(); }
  });
  $("#setTheme").addEventListener("change", e => { theme = e.target.value; store.set("theme", theme); render(); });
  $("#setAuto").addEventListener("change", e => { autoMin = Math.max(0, +e.target.value || 0); store.set("autoRefresh", autoMin); setupAuto(); toast(autoMin ? t("autoOn", {n: autoMin}) : t("autoOff")); });
  $("#setProxy").addEventListener("change", e => { store.set("proxy", e.target.value.trim()); toast(t("proxySaved"), "ok"); });
  $("#setReader").addEventListener("change", e => { openInReader = e.target.checked; store.set("openInReader", openInReader); toast(openInReader ? t("readerOn") : t("readerOff")); });
  $("#setPrefetch").addEventListener("change", e => { prefetchOn = e.target.checked; store.set("prefetchOn", prefetchOn); toast(prefetchOn ? t("prefetchOn") : t("prefetchOff")); });
  $("#imgCacheClear").addEventListener("click", () => {
    for (const k of Object.keys(ic)) delete ic[k];
    store.del("ic");
    toast(t("imgCacheCleared"), "ok");
  });
  $("#resetAll").addEventListener("click", () => {
    if (!confirm(t("resetConfirm"))) return;
    ["sources","view","density","sort","theme","saved","read","autoRefresh","proxy","ic","openInReader","prefetchOn","readerFont","font","lang"].forEach(store.del);
    location.reload();
  });
  $("#opmlExport").addEventListener("click", () => {
    const xml = `<?xml version="1.0" encoding="UTF-8"?>
<opml version="1.0">
  <head><title>Personal news subscriptions</title></head>
  <body>
    ${sources.map(s => `<outline type="rss" text="${escAttr(s.title)}" title="${escAttr(s.title)}" xmlUrl="${escAttr(s.url)}"/>`).join("\n    ")}
  </body>
</opml>`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([xml], {type:"text/xml"}));
    a.download = "personal-news.opml";
    a.click(); URL.revokeObjectURL(a.href);
    toast(t("opmlExported"), "ok");
  });
  $("#opmlImport").addEventListener("click", () => $("#opmlFile").click());
  $("#opmlFile").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const doc = new DOMParser().parseFromString(await f.text(), "text/xml");
      const outlines = [...doc.querySelectorAll("outline[xmlUrl]")];
      let n = 0;
      for (const o of outlines){
        const url = o.getAttribute("xmlUrl");
        if (!url || sources.some(s => s.url === url)) continue;
        const title = o.getAttribute("text") || o.getAttribute("title") || new URL(url).hostname;
        addSource({url, title}); n++;
      }
      $("#settingsDlg").close();
      toast(n ? t("importedSources", {n}) : t("noNewSources"), n ? "ok" : "");
      if (n){ refreshAll(); } else { render(); }
    } catch { toast(t("opmlError"), "err"); }
  });
}
function openSettings(){
  fillSettings();
  if (!$("#settingsDlg").open) $("#settingsDlg").showModal();
}

/* ============ Render: main ============ */
function render(){
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.density = density;
  document.documentElement.dataset.font = fontId === "sahel" ? "" : fontId;
  document.body.classList.toggle("grid", viewMode === "grid");
  document.body.classList.toggle("channel", viewMode === "channel");
  document.documentElement.dataset.view = viewMode;
  renderSide();
  $$("#tg button").forEach(b => b.classList.toggle("on", b.dataset.v === viewMode));
  $$("#densSeg button").forEach(b => b.classList.toggle("on", b.dataset.dens === density));
  $$("#sortSeg button").forEach(b => b.classList.toggle("on", b.dataset.sort === sortMode));
  $("#tg").classList.toggle("hide", state.page === "add");
  /* density does nothing in channel mode → hide it */
  $("#densSeg").classList.toggle("hide", state.page === "add" || viewMode === "channel");
  $("#sortSeg").classList.toggle("hide", state.page === "add");
  const view = $("#view");
  const oldEls = new Map();
  view.querySelectorAll("[data-recycle]").forEach(el => {
    oldEls.set(el.dataset.recycle, el);
  });
  let html, after;
  if (state.page === "add"){
    $("#ttl").textContent = t("addSourceTitle");
    const keep = $("#q") && $("#q").value;
    html = renderAddHTML();
    after = () => { if (keep){ const q = $("#q"); if (q) q.value = keep; } };
  } else if (state.page === "saved"){
    $("#ttl").textContent = t("savedItems");
    html = renderNewsHTML();
    after = hydrateRec;
  } else {
    $("#ttl").textContent = state.src
      ? (sources.find(s => s.url === state.src) || {}).title || t("sourceWord")
      : t("mySourcesTitle");
    html = renderNewsHTML();
    after = hydrateRec;
  }
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("[data-recycle]").forEach(newEl => {
    const key = newEl.dataset.recycle;
    const oldEl = oldEls.get(key);
    if (!oldEl) return;
    if (oldEl.className !== newEl.className) return;
    const os = oldEl.querySelector("[data-save]");
    const ns = newEl.querySelector("[data-save]");
    if (os && ns){
      if (os.className !== ns.className) os.className = ns.className;
      const nsData = ns.getAttribute("data-save");
      if (nsData && os.getAttribute("data-save") !== nsData) os.setAttribute("data-save", nsData);
      const nsTitle = ns.getAttribute("title");
      if (nsTitle) os.setAttribute("title", nsTitle);
    }
    const newDir = newEl.getAttribute("dir");
    if (newDir) oldEl.setAttribute("dir", newDir);
    else oldEl.removeAttribute("dir");
    newEl.replaceWith(oldEl);
  });
  tmp.querySelectorAll(".card").forEach(el => {
    if (!oldEls.has(el.dataset.recycle)) el.classList.add("enter");
  });
  view.replaceChildren(...tmp.childNodes);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      view.querySelectorAll(".card.enter").forEach(el => el.classList.remove("enter"));
    });
  });
  after && after();
}

/* ============ Events: clicks ============ */
document.addEventListener("click", e => {
  const c = e.target.closest(".card[data-link], .ch-row[data-link]");
  if (!c) return;
  if (e.target.closest("[data-save]")) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  if (e.button && e.button !== 0) return;
  if (!openInReader) return;
  e.preventDefault();
  openReader(c.dataset.link);
});
document.addEventListener("click", async e => {
  const saveEl = e.target.closest("[data-save]");
  if (saveEl){
    e.preventDefault(); e.stopPropagation();
    try { toggleSave(JSON.parse(saveEl.dataset.save)); } catch {}
    return;
  }
  const t2 = e.target.closest("[data-go],[data-src],[data-rm],[data-rsrc],[data-prev],[data-addrec],[data-v],[data-sort],[data-dens],[data-found],[data-read-all],[data-close]");
  if (!t2) return;
  const d = t2.dataset;
  if ("close" in d){ t2.closest("dialog")?.close(); return; }
  if (d.v){ viewMode = d.v; store.set("view", viewMode); return render(); }
  if (d.dens){ density = d.dens; store.set("density", density); return render(); }
  if (d.sort){ sortMode = d.sort; store.set("sort", sortMode); return render(); }
  if (d.go){
    state.page = d.go === "add" ? "add" : (d.go === "saved" ? "saved" : "news");
    state.src = null;
    if (state.page === "news") refreshAll();
    return render();
  }
  if (d.src){ state.page = "news"; state.src = d.src; return render(); }
  if (d.rm) return removeSource(d.rm);
  if (d.rsrc){ const s = sources.find(x => x.url === d.rsrc); if (s){ delete articles[s.url]; loadSource(s).then(render); toast(t("refreshing")); } return; }
  if ("readAll" in d) return markAllRead();
  if (d.addrec){ const c = CATALOG.find(x => x.url === d.addrec); if (c){ addSource(c); loadSource(c).then(render); toast(t("sourceAdded"), "ok"); renderSide(); } return; }
  if (d.prev){
    const c = CATALOG.find(x => x.url === d.prev);
    if (!c) return;
    $("#pvTitle").textContent = c.title;
    $("#pvBody").innerHTML = `<div class="meta">${esc(t("readerLoading"))}</div>`;
    $("#previewDlg").showModal();
    try {
      const f = parseFeed(await fetchText(c.url));
      $("#pvBody").innerHTML = `<ul dir="auto">` +
        f.items.slice(0, 8).map(i => `<li><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a></li>`).join("") + `</ul>`;
    } catch {
      $("#pvBody").innerHTML = `<div class="meta" style="color:var(--red)">${esc(t("readerErr"))}</div>`;
    }
  }
});
document.addEventListener("click", e => {
  const c = e.target.closest(".card[data-link], .ch-row[data-link]");
  if (c && !e.target.closest("[data-save]")){
    markRead(c.dataset.link);
    c.classList.add("read");
    renderSide();
  }
}, true);

/* ============ Events: input / search ============ */
let searchTimer, seq = 0;
const searchInput = $("#search");
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  $("#searchClear").hidden = !searchQuery;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { if (state.page === "news" || state.page === "saved") render(); }, 180);
});
$("#searchClear").addEventListener("click", () => {
  searchInput.value = ""; searchQuery = ""; $("#searchClear").hidden = true; render(); searchInput.focus();
});
document.addEventListener("input", e => {
  if (e.target.id === "proxy"){ store.set("proxy", e.target.value.trim()); return; }
  if (e.target.id !== "q") return;
  clearTimeout(timer);
  const v = e.target.value, my = ++seq, box = $("#found");
  if (!v.trim()){ box.innerHTML = ""; return; }
  timer = setTimeout(async () => {
    if (!normalizeUrl(v)){
      const hits = CATALOG.filter(c => c.title.toLowerCase().includes(v.toLowerCase()));
      box.innerHTML = hits.length
        ? hits.map(c => `<div class="row"><span class="grow">${esc(c.title)}</span><button class="lnk" data-addrec="${esc(c.url)}">${esc(t("add"))}</button></div>`).join("")
        : `<span class="err">${esc(t("noMatchCatalog"))}</span>`;
      return;
    }
    box.innerHTML = `<span class="meta">${esc(t("lookingForFeeds"))}</span>`;
    const res = await discover(v, m => { if (my === seq) box.innerHTML = `<span class="meta">${esc(m)}</span>`; });
    if (my !== seq) return;
    if (!res.length){ box.innerHTML = `<span class="err">${esc(t("feedNotFound"))}</span>`; return; }
    box.innerHTML = res.map(r => {
      const has = sources.some(s => s.url === r.url);
      return `<div class="row"><span class="ok">✓</span><span class="grow" dir="auto">${esc(r.title)}</span><span class="meta">${r.kind} · ${esc(new URL(r.url).hostname)}</span>
        ${has ? `<span class="meta" style="color:var(--green)">${esc(t("added"))}</span>` : `<button class="lnk" data-found='${esc(JSON.stringify({url:r.url,title:r.title}))}'>${esc(t("add"))}</button>`}</div>`;
    }).join("");
  }, 450);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-found]"); if (!b) return;
  const s = JSON.parse(b.dataset.found);
  addSource(s); loadSource(s).then(render);
  b.outerHTML = `<span class="meta" style="color:var(--green)">${esc(t("added"))}</span>`;
  renderSide();
});

/* ============ Header actions ============ */
$("#refreshBtn").addEventListener("click", refreshAll);
$("#themeBtn").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  store.set("theme", theme);
  render();
});
$("#settingsBtn").addEventListener("click", openSettings);

/* ============ Auto refresh ============ */
function setupAuto(){
  clearInterval(autoTimer);
  if (autoMin > 0) autoTimer = setInterval(refreshAll, autoMin * 60000);
}

/* ============ Keyboard shortcuts ============ */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#reader").hidden){
    e.preventDefault();
    history.back();
    return;
  }
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if (e.key === "Escape"){
    if (searchQuery){ searchInput.value=""; searchQuery=""; $("#searchClear").hidden=true; render(); }
    return;
  }
  if (typing) return;
  if (e.key === "/"){ e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
  if (e.key === "r" || e.key === "R"){ e.preventDefault(); refreshAll(); return; }
  if (e.key === "t" || e.key === "T"){ e.preventDefault(); $("#themeBtn").click(); return; }
  if (e.key === "g" || e.key === "G"){ viewMode = "grid"; store.set("view", viewMode); render(); return; }
  if (e.key === "l" || e.key === "L"){ viewMode = "list"; store.set("view", viewMode); render(); return; }
  if (e.key === "c" || e.key === "C"){ viewMode = "channel"; store.set("view", viewMode); render(); return; }
});

/* ============ PWA ============ */
(function setupPWA(){
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#070b12"/><circle cx="256" cy="256" r="150" fill="none" stroke="#ff1b2d" stroke-width="72"/><circle cx="256" cy="256" r="52" fill="#ff1b2d" opacity=".22"/></svg>`;
  const iconUrl = "data:image/svg+xml;utf8," + encodeURIComponent(svgIcon);
  const manifest = {
    name: "Personal news", short_name: "News", description: "A single-file RSS/Atom reader",
    start_url: "./", scope: "./", display: "standalone",
    background_color: "#070b12", theme_color: "#070b12",
    icons: [
      { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
      { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
    ]
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"});
    $("#manifestLink").href = URL.createObjectURL(blob);
  } catch {}
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
})();

/* ============ Init ============ */
applyLang();
setFont(fontId);
document.documentElement.style.setProperty("--rd-size", readerFontSize + "px");
render();
setupAuto();
if (sources.length) refreshAll();
if (location.hash.startsWith("#!r=")){
  try {
    const link = b64urlDecode(location.hash.slice(4));
    if (link) showReader(link);
  } catch {}
}
</script>
</body>
</html>
