function ago(ts){
  if (!ts) return "";
  const m = Math.max(1, Math.round((Date.now() - ts) / 60000));
  if (m < 60) return t("minAgo", {n: m});
  const h = Math.round(m / 60); if (h < 24) return t("hourAgo", {n: h});
  const d = Math.round(h / 24); if (d < 30) return t("dayAgo", {n: d});
  return t("monthAgo", {n: Math.round(d / 30)});
}
function group(ts){
  const age = Date.now() - ts, day = new Date(); day.setHours(0,0,0,0);
  if (age < 3 * 3600e3) return t("groupRecent");
  if (ts >= day.getTime()) return t("groupToday");
  if (ts >= day.getTime() - 864e5) return t("groupYesterday");
  if (ts >= day.getTime() - 7 * 864e5) return t("groupThisWeek");
  if (ts >= day.getTime() - 14 * 864e5) return t("groupLastWeek");
  return t("groupEarlier");
}

/* ============ Article extraction ============ */
const ALLOWED_TAGS = new Set(["P","H1","H2","H3","H4","H5","H6","UL","OL","LI","BLOCKQUOTE","PRE","CODE","A","IMG","FIGURE","FIGCAPTION","EM","STRONG","B","I","U","BR","HR","TABLE","THEAD","TBODY","TR","TD","TH","SPAN","DIV","SUP","SUB","MARK","TIME","CITE","SMALL"]);
const ALLOWED_ATTRS = new Set(["href","src","alt","title","colspan","rowspan","width","height","loading"]);
function sanitizeTree(node, baseUrl){
  if (node.nodeType === 1){
    if (!ALLOWED_TAGS.has(node.tagName)){
      const frag = document.createDocumentFragment();
      while (node.firstChild) frag.appendChild(node.firstChild);
      node.replaceWith(frag);
      return;
    }
    for (const attr of [...node.attributes]){
      const name = attr.name.toLowerCase();
      if (name === "class" || name === "id" || name === "style"){ node.removeAttribute(attr.name); continue; }
      if (!ALLOWED_ATTRS.has(name)){ node.removeAttribute(attr.name); continue; }
      const v = attr.value.trim();
      if (name === "href" || name === "src"){
        if (/^javascript:/i.test(v) || /^data:(?!image\/)/i.test(v) || /^vbscript:/i.test(v)){ node.removeAttribute(attr.name); continue; }
        if (!/^(https?:|mailto:|#|\/)/i.test(v)){
          try { node.setAttribute(attr.name, new URL(v, baseUrl).href); }
          catch { node.removeAttribute(attr.name); }
        }
      }
    }
    if (node.tagName === "A" && node.getAttribute("href")){
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
    for (const child of [...node.childNodes]) sanitizeTree(child, baseUrl);
  } else if (node.nodeType === 11 || node.nodeType === 9){
    for (const child of [...node.childNodes]) sanitizeTree(child, baseUrl);
  }
}
function extractArticle(html, url){
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  const metaSel = (sel) => {
    const el = doc.querySelector(sel);
    return el ? (el.content || el.getAttribute("content") || el.textContent || "").trim() : "";
  };
  const meta = {
    title: metaSel('meta[property="og:title"]') || metaSel('meta[name="twitter:title"]') || (doc.querySelector("title") ? doc.querySelector("title").textContent.trim() : ""),
    image: resolveImgUrl(metaSel('meta[property="og:image"]') || metaSel('meta[name="twitter:image"]') || "", url),
    description: metaSel('meta[property="og:description"]') || metaSel('meta[name="description"]') || metaSel('meta[name="twitter:description"]') || "",
    siteName: metaSel('meta[property="og:site_name"]') || "",
    htmlLang: (doc.documentElement.getAttribute("lang") || "").toLowerCase(),
    htmlDir: (doc.documentElement.getAttribute("dir") || "").toLowerCase()
  };
  doc.querySelectorAll('script,style,noscript,iframe,form,nav,header,footer,aside,svg,button,input,select,textarea,[role="navigation"],[role="banner"],[role="complementary"],[role="contentinfo"],[aria-hidden="true"],.ad,.ads,.advert,.share,.social,.comments,.sidebar,.menu,.nav').forEach(n => n.remove());
  const score = el => {
    if (!el || !el.textContent) return 0;
    const text = el.textContent.trim();
    const len = text.length;
    if (len < 120) return 0;
    const linkLen = [...el.querySelectorAll("a")].reduce((n, a) => n + (a.textContent || "").length, 0);
    const linkDensity = len ? linkLen / len : 1;
    const commas = (text.match(/[,،.]/g) || []).length;
    const ps = el.querySelectorAll("p").length;
    const imgs = el.querySelectorAll("img").length;
    return len * (1 - linkDensity) + commas * 20 + ps * 40 + imgs * 25;
  };
  const seeds = [...doc.querySelectorAll('article, main, [role="main"], .post, .article, .entry-content, .post-content, .article-content, .article-body, #content, #main, .content, [itemprop="articleBody"]')];
  let best = null, bestScore = 0;
  for (const el of seeds){
    const s = score(el);
    if (s > bestScore){ best = el; bestScore = s; }
  }
  if (!best){
    for (const el of doc.querySelectorAll("div, section")){
      const s = score(el);
      if (s > bestScore){ best = el; bestScore = s; }
    }
  }
  if (!best) best = doc.body;
  const clone = best.cloneNode(true);
  clone.querySelectorAll("div:empty, p:empty, span:empty").forEach(n => n.remove());
  clone.querySelectorAll("img").forEach(img => {
    let src = img.getAttribute("src") || img.getAttribute("data-src") || img.getAttribute("data-lazy-src") || img.getAttribute("data-original") || "";
    if (!src){ img.remove(); return; }
    src = resolveImgUrl(src, url);
    img.setAttribute("src", src);
    img.setAttribute("loading", "lazy");
    img.removeAttribute("srcset");
    img.removeAttribute("sizes");
  });
  sanitizeTree(clone, url);
  const contentText = (clone.textContent || "").replace(/\s+/g, " ").trim();
  let direction = "";
  if (meta.htmlDir === "rtl") direction = "rtl";
  else if (meta.htmlDir === "ltr") direction = "ltr";
  else if (/^(fa|ar|he|ur|ckb|ps|sd|ug|yi|dv)(-|$)/.test(meta.htmlLang)) direction = "rtl";
  else direction = detectDirection(meta.title + " " + contentText);
  return {title: meta.title, image: meta.image, description: meta.description, siteName: meta.siteName, contentHTML: clone.innerHTML, contentText, direction};
}

/* ============ Prefetch ============ */
const prefetchCache = new Map();
const PREFETCH_MAX = 40;
function prefetch(link){
  if (prefetchCache.has(link)){
    const entry = prefetchCache.get(link);
    prefetchCache.delete(link); prefetchCache.set(link, entry);
    return entry.promise;
  }
  const entry = {};
  entry.promise = (async () => {
    const html = await fetchText(link, 12000);
    entry.article = extractArticle(html, link);
    return entry.article;
  })().catch(err => { entry.error = err; throw err; });
  prefetchCache.set(link, entry);
  if (prefetchCache.size > PREFETCH_MAX){
    const first = prefetchCache.keys().next().value;
    prefetchCache.delete(first);
  }
  return entry.promise;
}
let hoverTimer = null, hoverLink = null;
function schedulePrefetch(link){
  if (!prefetchOn) return;
  if (prefetchCache.has(link)){ prefetchCache.get(link).promise.catch(() => {}); return; }
  clearTimeout(hoverTimer);
  hoverLink = link;
  hoverTimer = setTimeout(() => { if (hoverLink === link) prefetch(link).catch(() => {}); }, 200);
}

const b64urlEncode = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const b64urlDecode = s => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};

/* ============ Text-to-speech (Read Aloud) ============ */
let ttsUtterance = null;
let ttsPaused = false;
let ttsState = "idle";
let ttsVoices = [];
function ttsAvailable(){
  return "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
}
function ttsLoadVoices(){
  if (!ttsAvailable()) return [];
  try { ttsVoices = window.speechSynthesis.getVoices() || []; } catch { ttsVoices = []; }
  return ttsVoices;
}
function ttsPreferredLang(){
  const dir = $("#rdContent").getAttribute("dir");
  return dir === "rtl" ? "fa-IR" : "en-US";
}
function ttsPickVoice(){
  if (!ttsVoices.length) ttsLoadVoices();
  const savedV = store.get("ttsVoice", "");
  if (savedV){
    const v = ttsVoices.find(x => x.voiceURI === savedV || x.name === savedV);
    if (v) return v;
  }
  const lang = ttsPreferredLang();
  const primary = lang.split("-")[0];
  return ttsVoices.find(v => v.lang === lang && v.localService)
      || ttsVoices.find(v => v.lang === lang)
      || ttsVoices.find(v => v.lang && v.lang.toLowerCase().startsWith(primary))
      || null;
}
function ttsGetContent(){
  const content = $("#rdContent");
  if (!content) return "";
  const h1 = content.querySelector(".rd-h1");
  const body = content.querySelector(".rd-body");
  const parts = [];
  if (h1) parts.push(h1.textContent);
  if (body){
    body.querySelectorAll("p, h2, h3, h4, li, blockquote").forEach(el => {
      const tx = el.textContent.trim();
      if (tx) parts.push(tx);
    });
  }
  return parts.filter(Boolean).join("\n\n");
}
function ttsUpdateButton(){
  const btn = $("#rdTTS");
  if (!btn) return;
  if (ttsState === "playing"){
    btn.textContent = "⏸";
    btn.title = t("pauseReading");
    btn.classList.add("active");
  } else if (ttsState === "paused"){
    btn.textContent = "▶";
    btn.title = t("resumeReading");
    btn.classList.add("active");
  } else {
    btn.textContent = "🔊";
    btn.title = t("readAloud");
    btn.classList.remove("active");
  }
}
function ttsSpeak(){
  if (!ttsAvailable()){ toast("Speech synthesis not supported", "err"); return; }
  const text = ttsGetContent();
  if (!text){ toast(t("readerErr"), "err"); return; }
  stopTTS();
  const CHUNK = 3500;
  const chunks = [];
  if (text.length <= CHUNK) chunks.push(text);
  else {
    const parts = text.split(/\n\n+/);
    let buf = "";
    for (const p of parts){
      if ((buf + p).length > CHUNK){
        if (buf.trim()) chunks.push(buf.trim());
        buf = p + "\n\n";
      } else {
        buf += p + "\n\n";
      }
    }
    if (buf.trim()) chunks.push(buf.trim());
  }
  const voice = ttsPickVoice();
  const rate = parseFloat(store.get("ttsRate", 1)) || 1;
  const lang = ttsPreferredLang();
  let idx = 0;
  const total = text.length;
  const cumulative = [];
  let acc = 0;
  for (const c of chunks){ cumulative.push(acc); acc += c.length; }
  const speakNext = () => {
    if (ttsState !== "playing" && ttsState !== "paused") return;
    if (idx >= chunks.length){ ttsState = "idle"; ttsUpdateButton(); return; }
    const u = new SpeechSynthesisUtterance(chunks[idx]);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : lang;
    u.rate = rate;
    u.onend = () => {
      idx++;
      if (idx >= chunks.length){ ttsState = "idle"; ttsUpdateButton(); }
      else speakNext();
    };
    u.onerror = () => { ttsState = "idle"; ttsUpdateButton(); };
    u.onboundary = (e) => {
      const pos = cumulative[idx] + (e.charIndex || 0);
      const ratio = pos / total;
      const prog = $("#rdProgress");
      if (prog) prog.style.width = (ratio * 100) + "%";
      const body = $("#rdContent .rd-body");
      if (body){
        const approx = body.scrollHeight * ratio;
        const sc = $("#rdScroll");
        if (sc && Math.abs(sc.scrollTop - approx) > 120) sc.scrollTo({top: approx, behavior: "smooth"});
      }
    };
    ttsUtterance = u;
    window.speechSynthesis.speak(u);
  };
  ttsState = "playing";
  speakNext();
  ttsUpdateButton();
}
function ttsToggle(){
  if (!ttsAvailable()){ toast("Speech synthesis not supported", "err"); return; }
  if (ttsState === "playing"){
    window.speechSynthesis.pause();
    ttsState = "paused";
    ttsUpdateButton();
  } else if (ttsState === "paused"){
    window.speechSynthesis.resume();
    ttsState = "playing";
    ttsUpdateButton();
  } else {
    ttsSpeak();
  }
}
function stopTTS(){
  if (!ttsAvailable()) return;
  try { window.speechSynthesis.cancel(); } catch {}
  ttsUtterance = null;
  ttsState = "idle";
  ttsPaused = false;
  ttsUpdateButton();
}
if (ttsAvailable()){
  window.speechSynthesis.onvoiceschanged = () => {
    ttsLoadVoices();
    // getVoices() is async in Firefox/Chrome; refresh the settings dialog
    // voice list in place if it's currently mounted and open.
    const sel = document.getElementById("setTTSVoice");
    if (sel && sel.isConnected){
      const cur = store.get("ttsVoice", "");
      sel.innerHTML = `<option value="">${esc(t("voiceDefault"))}</option>` +
        ttsVoices.map(v =>
          `<option value="${escAttr(v.voiceURI)}" ${cur === v.voiceURI ? "selected" : ""}>${esc(v.name)} (${esc(v.lang)})</option>`
        ).join("");
    }
  };
  ttsLoadVoices();
}
/* ============ Translate article to Persian ============ */
let readerTranslated = false;
let readerTranslation = null;

async function translateChunk(text, target) {
  if (!text || !text.trim()) return "";
  const apiUrl = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" +
                 encodeURIComponent(target) + "&dt=t&q=" + encodeURIComponent(text);
  const parse = async (r) => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    return (data[0] || []).map(x => x[0]).filter(Boolean).join("");
  };
  try { return await parse(await fetch(apiUrl)); } catch {}
  for (const p of proxies()) {
    try { return await parse(await fetch(p(apiUrl))); } catch {}
  }
  throw new Error("translate-failed");
}

async function translateAll(texts, target, concurrency = 4) {
  const out = new Array(texts.length);
  let idx = 0;
  const workers = Array.from({ length: Math.min(concurrency, Math.max(1, texts.length)) }, async () => {
    while (idx < texts.length) {
      const i = idx++;
      try { out[i] = await translateChunk(texts[i], target); }
      catch { out[i] = texts[i]; }
    }
  });
  await Promise.all(workers);
  return out;
}

function resetTranslateState() {
  readerTranslated = false;
  readerTranslation = null;
  const btn = $("#rdTranslate");
  if (btn) { btn.classList.remove("active", "loading"); btn.title = t("translateToFa"); }
}

async function toggleTranslate() {
  const content = $("#rdContent");
  const btn = $("#rdTranslate");
  if (!content || !btn) return;

  /* بازگشت به متن اصلی */
  if (readerTranslated) {
    if (readerTranslation) {
      const h1 = content.querySelector(".rd-h1");
      if (h1) h1.textContent = readerTranslation.originalTitle;
      const body = content.querySelector(".rd-body");
      if (body) body.innerHTML = readerTranslation.originalBody;
      content.setAttribute("dir", readerTranslation.originalDir || "ltr");
      content.removeAttribute("lang");
    }
    readerTranslated = false;
    btn.classList.remove("active");
    btn.title = t("translateToFa");
    return;
  }

  const body = content.querySelector(".rd-body");
  if (!body) { toast(t("translateError"), "err"); return; }
  const h1 = content.querySelector(".rd-h1");

  /* فقط المان‌های متنی را بگیر (بدون عکس/کد) */
  const els = [...body.querySelectorAll("p, h2, h3, h4, li, blockquote")]
    .filter(el => (el.textContent || "").trim() &&
                  !el.querySelector("img, figure, video, iframe, pre, code"));
  const texts = els.map(el => el.textContent.trim());
  const titleText = h1 ? h1.textContent.trim() : "";

  readerTranslation = {
    originalTitle: titleText,
    originalBody: body.innerHTML,
    originalDir: content.getAttribute("dir") || "ltr"
  };

  btn.classList.add("active", "loading");
  btn.title = t("translating");
  toast(t("translating"));

  const target = "fa"; /* همیشه به فارسی */
  try {
    const results = await translateAll([titleText, ...texts], target);
    if (h1 && results[0]) h1.textContent = results[0];
    els.forEach((el, i) => {
      const tx = results[i + 1];
      if (tx) el.textContent = tx;
    });
    content.setAttribute("dir", "rtl");
    content.setAttribute("lang", "fa");
    readerTranslated = true;
    btn.classList.remove("loading");
    btn.title = t("showOriginal");
    toast(t("translatedBadge"), "ok");
  } catch (e) {
    btn.classList.remove("active", "loading");
    btn.title = t("translateToFa");
    readerTranslation = null;
    toast(t("translateError"), "err");
  }
}

async function translateItem(item){
  if (!item || !item.link || !item.title) return;
  if (translateCache[item.link] || translatePending.has(item.link)) return;
  translatePending.add(item.link);
  try {
    const summary = item.html ? plain(item.html).slice(0, 260) : "";
    const texts = summary ? [item.title, summary] : [item.title];
    const results = await translateAll(texts, "fa");
    translateCache[item.link] = {
      title: results[0] || item.title,
      summary: results[1] || summary,
      ts: Date.now()
    };
    saveTranslateCache();
    scheduleLiveRerender();
  } catch {}
  translatePending.delete(item.link);
  updateLiveTranslateBusy();
}
function ensureLiveTranslations(items){
  if (!liveTranslateAll) return;
  const todo = items.filter(a => a && a.link && a.title &&
    !translateCache[a.link] && !translatePending.has(a.link));
  todo.forEach(translateItem);
  updateLiveTranslateBusy();
}
function updateLiveTranslateBusy(){
  const btn = $("#liveTranslateBtn");
  if (!btn) return;
  btn.classList.toggle("busy", translatePending.size > 0);
}
function setLiveTranslate(on){
  liveTranslateAll = !!on;
  store.set("liveTranslateAll", liveTranslateAll);
  const btn = $("#liveTranslateBtn");
  if (btn){
    btn.classList.toggle("on", liveTranslateAll);
    btn.title = liveTranslateAll ? t("showOriginal") : t("translateToFa");
  }
  toast(liveTranslateAll ? t("liveTranslateOn") : t("liveTranslateOff"),
        liveTranslateAll ? "ok" : "");
  render();
}
function displayTitle(a){
  if (liveTranslateAll){
    const tr = translateCache[a.link];
    if (tr && tr.title) return tr.title;
  }
  return a.title;
}
function displaySummary(a, max){
  if (liveTranslateAll){
    const tr = translateCache[a.link];
    if (tr && tr.summary) return tr.summary;
  }
  return plain(a.html || "").slice(0, max || 260);
}

  const list = articles[srcUrl] || [];
  return list.filter(a => !isRead(a.link)).length;
}
function totalUnread(){
  return sources.reduce((n, s) => n + unreadCount(s.url), 0);
}
function faviconFor(url){
  try {
    const u = new URL(url);
    if (u.hostname) return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(u.hostname)}&sz=32`;
  } catch {}
  return "";
}
function faviconHtml(url, fallback){
  const src = faviconFor(url);
  if (!src) return `<span class="src-favicon placeholder">${fallback || "•"}</span>`;
  return `<img class="src-favicon" src="${esc(src)}" alt="" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'"><span class="src-favicon placeholder" style="display:none">${fallback || "•"}</span>`;
}

/* ============ Render: Mosaic ============ */
function mosaic(items){
  const h = l => l.map(cardHtml).join("");
  const takeB = i => {
    const M = [], T = []; let j = i;
    while (j < items.length){
      const a = items[j];
      if (a.ok){ if (M.length === 2) break; M.push(a); } else { if (T.length === 3) break; T.push(a); }
      j++;
    }
    return M.length === 2 && T.length ? {M, T, n: j - i} : null;
  };
  const isA = i => items[i] && items[i].ok && items[i + 1] && items[i + 1].ok && items[i + 2] && items[i + 2].ok;
  let out = "", i = 0, useB = false;
  while (i < items.length){
    const B = takeB(i);
    if (useB && B){
      out += `<div class="row b">${h(B.M)}<div class="stack">${h(B.T)}</div></div>`; i += B.n; useB = false;
    } else if (isA(i)){
      out += `<div class="row a">${h(items.slice(i, i + 3))}</div>`; i += 3; useB = true;
    } else if (B){
      out += `<div class="row b">${h(B.M)}<div class="stack">${h(B.T)}</div></div>`; i += B.n; useB = false;
    } else if (items[i].ok && items[i + 1] && items[i + 1].ok && !(items[i + 2] && !items[i + 2].ok)){
      out += `<div class="row d">${h(items.slice(i, i + 2))}</div>`; i += 2;
    } else if (!items[i].ok){
      let j = i; while (j < items.length && !items[j].ok && j - i < 6) j++;
      out += `<div class="row c tt">${h(items.slice(i, j))}</div>`; i = j;
    } else {
      const part = items.slice(i, i + 4);
      out += `<div class="row c ${part.some(a => a.ok) ? "" : "tt"}">${h(part)}</div>`; i += part.length;
    }
  }
  return out;
}

/* ============ Render: News ============ */
function filteredItems(){
  let srcList;
  if (state.page === "saved"){
    srcList = sources;
  } else if (state.src){
    srcList = sources.filter(s => s.url === state.src);
  } else {
    srcList = (groupByTags && activeTag != null)
      ? sources.filter(s => (s.tags || []).includes(activeTag))
      : sources;
  }
  const scope = state.page === "saved"
    ? saved.slice()
    : srcList.flatMap(s => articles[s.url] || []);
  let items = scope.filter(a => a.title);
  const seenK = new Set();
  items = items.filter(a => { const k = normLink(a.link); if (!k) return true; if (seenK.has(k)) return false; seenK.add(k); return true; });
  if (filterUnread){
    items = items.filter(a => !isRead(a.link));
  }
  const q = searchQuery.trim().toLowerCase();
  if (q){
    items = items.filter(a =>
      a.title.toLowerCase().includes(q) ||
      (a.source || "").toLowerCase().includes(q) ||
      plain(a.html).toLowerCase().includes(q)
    );
  }
  items.sort((a, b) => (b.date || 0) - (a.date || 0));
  if (sortMode === "oldest") items.reverse();
  return items;
}

function renderNewsHTML(){
  const list0 = filteredItems();
  const readyItems = viewMode === "channel" ? list0 : list0.filter(a => a.done !== false);
  const loading = state.page !== "saved" && (
    !feedCacheReady || sources.some(s => (!articles[s.url] || (refreshing && !articles[s.url].length)) && (!state.src || state.src === s.url)) ||
    (viewMode !== "channel" && readyItems.length < list0.length)
  );
  const cnt = $("#cnt");
  if (cnt) cnt.textContent = list0.length ? t("articleCount", {n: list0.length}) : "";
  const list = readyItems.slice(0, visibleNewsCount);
  if (!list.length){
    if (loading) return `<div class="feed">${"<div class='skel'></div>".repeat(5)}</div>`;
    const isSearch = !!searchQuery.trim();
    if (!isSearch && state.page === "news" && !state.src && sources.length === 0){
      return `<div class="feed"><section class="empty welcome">
        <span class="welcome-kicker">${esc(t("welcomeKicker"))}</span>
        <div class="big" aria-hidden="true">✦</div>
        <h3>${esc(t("welcomeTitle"))}</h3>
        <p>${esc(t("welcomeText"))}</p>
        <button class="btn welcome-cta" data-go="add"><span aria-hidden="true">＋</span>${esc(t("welcomeCta"))}</button>
        <div class="welcome-hint"><span></span>${esc(t("welcomeHint"))}</div>
      </section></div>`;
    }
    return `<div class="feed"><div class="empty">
      <div class="big">${isSearch ? "⌕" : "◇"}</div>
      <h3>${esc(isSearch ? t("noMatchesTitle") : t("emptyTitle"))}</h3>
      <p>${esc(isSearch ? t("noMatchesText") : t("emptyText"))}</p>
    </div></div>`;
  }
  const groups = [];
  for (const a of list){
    const g = a.date ? group(a.date) : t("groupEarlier");
    const last = groups[groups.length - 1];
    if (last && last.g === g) last.items.push(a); else groups.push({g, items: [a]});
  }
  let out = `<div class="feed">`;
  for (const G of groups){
    out += `<h3>${esc(G.g)}</h3>`;
    if (viewMode === "channel"){
      out += `<div class="channel-list">` + G.items.map(channelRowHtml).join("") + `</div>`;
    } else if (viewMode === "newspaper"){
      out += newspaperHTML(G.items);
    } else if (viewMode === "grid"){
      out += mosaic(G.items);
    } else {
      out += G.items.map(cardHtml).join("");
    }
  }
  if (readyItems.length > visibleNewsCount && !loading){
    const n = Math.min(50, readyItems.length - visibleNewsCount);
    out += `<div class="load-more-wrap"><button class="btn ghost" data-load-more>${esc(t("loadMore", {n}))}</button></div>`;
  }
  if (state.page === "news" && !state.src && !loading && visibleNewsCount >= readyItems.length){

/* ============ Render: Stats panel (with heatmap) ============ */
function startOfDay(ts){
  const d = new Date(ts || Date.now());
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function computeStats(){
  const today0 = startOfDay(Date.now());
  const week0 = today0 - 6 * 864e5;
  let today = 0, thisWeek = 0;
  const sourceCounts = {};
  let total = 0, totalWithTs = 0;
  for (const link in readLog){
    const e = readLog[link];
    total++;
    if (e.ts){
      totalWithTs++;
      if (e.ts >= today0) today++;
      if (e.ts >= week0) thisWeek++;
      if (e.source) sourceCounts[e.source] = (sourceCounts[e.source] || 0) + 1;
    }
  }
  const topSources = Object.entries(sourceCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([source, n]) => ({source, n}));
  const savedCount = saved.length;
  const sourcesCount = sources.length;
  const unreadCount = totalUnread();
  return {
    total, today, thisWeek, topSources,
    avgPerDay: totalWithTs ? Math.round(totalWithTs / 14 * 10) / 10 : 0,
    savedCount, sourcesCount, unreadCount
  };
}
function computeYearHeatmap(){
  const days = new Map();
  const now = new Date(); now.setHours(0,0,0,0);
  const endTs = now.getTime();
  const start = new Date(now);
  start.setDate(start.getDate() - 370);
  start.setDate(start.getDate() - start.getDay());
  const startTs = start.getTime();
  const totalDays = Math.round((endTs - startTs) / 864e5) + 1;
  const weeks = Math.ceil(totalDays / 7);
  for (let i = 0; i < weeks * 7; i++) days.set(startTs + i * 864e5, 0);
  let max = 1, total = 0;
  for (const link in readLog){
    const e = readLog[link];
    if (!e || !e.ts) continue;
    const d = new Date(e.ts); d.setHours(0,0,0,0);
    const k = d.getTime();
    if (days.has(k)){
      const v = (days.get(k) || 0) + 1;
      days.set(k, v);
      total++;
      if (v > max) max = v;
    }
  }
  return {startTs, endTs, weeks, days, max, total};
}
function renderHeatmapHTML(){
  const h = computeYearHeatmap();
  const monthNames = appLang === "fa"
    ? ["فرو","ارد","خرد","تیر","مرد","شهر","مهر","آبا","آذر","دی","بهم","اسف"]
    : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayShort = appLang === "fa" ? ["ی","د","س","چ","پ","ج","ش"] : ["S","M","T","W","T","F","S"];
  const today = new Date(); today.setHours(0,0,0,0); const todayTs = today.getTime();
  const weeksData = [];
  for (let w = 0; w < h.weeks; w++){
    const col = [];
    for (let d = 0; d < 7; d++) col.push(h.startTs + (w * 7 + d) * 864e5);
    weeksData.push(col);
  }
  let cellHtml = "";
  let monthLabels = [];
  let lastMonth = -1;
  for (let w = 0; w < weeksData.length; w++){
    const dt = new Date(weeksData[w][0]);
    const m = dt.getMonth();
    if (m !== lastMonth && dt.getDate() <= 7){
      monthLabels.push({w, label: monthNames[m]});
      lastMonth = m;
    }
  }
  for (let w = 0; w < weeksData.length; w++){
    for (let d = 0; d < 7; d++){
      const ts = weeksData[w][d];
      const isFuture = ts > todayTs;
      const cnt = h.days.get(ts) || 0;
      let lvl = 0;
      if (cnt > 0){
        const ratio = cnt / h.max;
        lvl = ratio <= .25 ? 1 : ratio <= .5 ? 2 : ratio <= .8 ? 3 : 4;
      }
      const cls = `heat-cell${lvl ? " l"+lvl : ""}${isFuture ? " future" : ""}`;
      const dd = new Date(ts);
      const dateStr = appLang === "fa"
        ? `${toFaNum(dd.getFullYear())}/${toFaNum(dd.getMonth()+1)}/${toFaNum(dd.getDate())}`
        : `${dd.getFullYear()}/${dd.getMonth()+1}/${dd.getDate()}`;
      if (!isFuture){
        cellHtml += `<div class="${cls}" data-heat="${ts}" data-cnt="${cnt}" data-date="${escAttr(dateStr)}"></div>`;
      } else {
        cellHtml += `<div class="${cls}"></div>`;
      }
    }
  }
  const monthLblHtml = monthLabels.map((m, i) => {
    const left = m.w * 15;
    const nextLeft = i+1 < monthLabels.length ? monthLabels[i+1].w * 15 : h.weeks * 15;
    const width = nextLeft - left - 4;
    return `<span style="position:absolute;inset-inline-start:${left}px;width:${width}px">${esc(m.label)}</span>`;
  }).join("");
  return `<div class="stats-section">
    <h3>${esc(t("statsHeatmap"))} <span class="stat-streak-pill">${formatNum(h.total)}</span></h3>
    <div style="position:relative;padding-inline-start:22px">
      <div class="heat-month-lbl" style="position:relative;height:12px">${monthLblHtml}</div>
      <div class="heatmap-wrap">
        <div class="heatmap-inner">
          <div class="heatmap-days">${dayShort.map(d => `<span>${esc(d)}</span>`).join("")}</div>
          <div class="heatmap-grid">${cellHtml}</div>
        </div>
      </div>
      <div class="heat-legend">
        <span>${esc(t("heatmapLess"))}</span>
        <i class="heat-cell" style="position:static"></i>
        <i class="heat-cell l1" style="position:static"></i>
        <i class="heat-cell l2" style="position:static"></i>
        <i class="heat-cell l3" style="position:static"></i>
        <i class="heat-cell l4" style="position:static"></i>
        <span>${esc(t("heatmapMore"))}</span>
      </div>
    </div>
  </div>`;
}

/* ============ Render: Daily Digest ============ */
function greetingForHour(){
  const h = new Date().getHours();
  if (h < 12) return t("digestGreetMorning");
  if (h < 17) return t("digestGreetNoon");
  if (h < 21) return t("digestGreetEvening");
  return t("digestGreetNight");
}
function computeDigest(){
  const today0 = startOfDay(Date.now());
  const yest0 = today0 - 864e5;
  const allItems = [];
  for (const s of sources){
    for (const a of (articles[s.url] || [])){
      if (a && a.title) allItems.push(a);
    }
  }
  const todayItems = allItems.filter(a => a.date && a.date >= today0);
  const sourceSet = new Set(todayItems.map(a => a.source).filter(Boolean));
  const yesterdaySaved = saved.filter(s => s.savedAt && s.savedAt >= yest0 && s.savedAt < today0 && !isRead(s.link));
  const topPicks = todayItems
    .filter(a => !isRead(a.link))
    .map(a => ({a, len: (a.title || "").length + plain(a.html || "").length}))
    .sort((x, y) => {
      const ix = (x.a.ok ? 1 : 0), iy = (y.a.ok ? 1 : 0);
      if (ix !== iy) return iy - ix;
      return y.len - x.len;
    })
    .slice(0, 5)
    .map(x => x.a);
  const unreadToday = todayItems.filter(a => !isRead(a.link));
  return {todayItems, unreadToday, sourceSet, yesterdaySaved, topPicks};
}
function digestItemHtml(a){
  const r = isRead(a.link);
  return `<a class="digest-item ${r ? "read" : ""}" href="${esc(a.link)}" data-link="${esc(a.link)}" target="_blank" rel="noopener noreferrer" dir="${itemDir(a)}">
    <span class="dot"></span>
    <span style="flex:1;min-width:0">
      <span class="t" dir="auto">${esc(displayTitle(a))}</span>
      <span class="meta"><b dir="auto">${esc(a.source || "")}</b><span>· ${esc(ago(a.date))}</span></span>
    </span>
  </a>`;
}
function todayQueue(){
  const y0 = startOfDay(Date.now()) - 864e5, seen = new Set(), list = [];
  for (const s of sources) for (const a of (articles[s.url] || [])){
    if (!a || !a.title || !a.date || a.date < y0 || isRead(a.link)) continue;
    const k = normLink(a.link); if (seen.has(k)) continue;
    seen.add(k); list.push(a);
  }
  list.sort((a, b) => b.date - a.date);
  return {total: list.length, shown: list.slice(0, 20)};
}
function markItemsRead(list){
  list.forEach(a => { if (!read.has(a.link)){ read.add(a.link); readLog[a.link] = {ts: Date.now(), source: a.source || "", title: a.title || ""}; } });
  store.set("read", [...read]); store.set("readLog", readLog);
  render();
  toast(appLang === "fa" ? "علامت‌گذاری شد" : "Marked as read", "ok");
}
function todayQueueHtml(){
  const fa = appLang === "fa";
  if (!feedCacheReady) return "<div class='skel'></div>".repeat(3);
  const q = todayQueue();
  if (!q.total) return `<div class="digest-empty today-done"><b>${fa ? "همه‌ی خبرهای تازه را خواندید ✓" : "You're all caught up ✓"}</b><span>${fa ? "از دیروز تا حالا خبر نخوانده‌ای نمانده." : "Nothing unread since yesterday."}</span><button class="btn ghost" data-go="all">${fa ? "دیدن همه‌ی خبرها" : "Browse all stories"}</button></div>`;
  const groups = new Map();
  q.shown.forEach(a => { const k = a.source || ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); });
  let html = "";
  for (const [src, items] of groups) html += `<div class="today-src" dir="auto">${esc(src)}</div><div class="digest-items">${items.map(digestItemHtml).join("")}</div>`;
  const more = q.total - q.shown.length;
  html += `<div class="today-foot"><button class="btn" data-today-read>${fa ? `علامت‌زدن این ${q.shown.length} مورد به‌عنوان خوانده` : `Mark these ${q.shown.length} as read`}</button>${more > 0 ? `<button class="btn ghost" data-go="all">${fa ? `${more} خبر دیگر در فید` : `${more} more in the feed`}</button>` : ""}</div>`;
  return html;
}

/* ============ Share menu ============ */
let shareMenuState = {link: "", title: ""};
function openShareMenu(link, title, anchorEl){
  shareMenuState = {link, title: title || link};
  let menu = $("#shareMenu");
  if (!menu){
    menu = document.createElement("div");
    menu.id = "shareMenu";
    menu.className = "share-menu";
    document.body.appendChild(menu);
    document.addEventListener("click", e => {
      if (!menu.contains(e.target) && !e.target.closest("[data-share]")) closeShareMenu();
    }, {capture: false});
  }
  menu.innerHTML = `
    <button data-share-action="telegram" title="${esc(t("shareTelegram"))}">
      <span class="ico">✈</span><span>${esc(t("shareTelegram"))}</span>
    </button>
    <button data-share-action="twitter" title="${esc(t("shareTwitter"))}">
      <span class="ico">𝕏</span><span>${esc(t("shareTwitter"))}</span>
    </button>
    <button data-share-action="copy" title="${esc(t("copyLink"))}">
      <span class="ico">⧉</span><span>${esc(t("copyLink"))}</span>
    </button>`;
  if (anchorEl){
    const r = anchorEl.getBoundingClientRect();
    const menuW = 180, menuH = 140;
    let left = r.right - menuW;
    let top = r.bottom + 6;
    if (top + menuH > window.innerHeight) top = r.top - menuH - 6;
    if (left < 8) left = 8;
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    menu.style.right = "auto";
    menu.classList.add("open");
  } else {
    menu.style.left = "50%";
    menu.style.top = "50%";
    menu.style.right = "auto";
    menu.classList.add("open");
  }
}
function closeShareMenu(){
  const menu = $("#shareMenu");
  if (menu) menu.classList.remove("open");
}
function handleShareAction(action, link, title){
  if (!link) return;
  if (action === "telegram"){
    window.open(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(title || "")}`, "_blank", "noopener");
  } else if (action === "twitter"){
    window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(link)}&text=${encodeURIComponent(title || "")}`, "_blank", "noopener");
  } else if (action === "copy"){
    navigator.clipboard.writeText(link).then(
      () => toast(t("linkCopied"), "ok"),
      () => {
        const ta = document.createElement("textarea");
        ta.value = link;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); toast(t("linkCopied"), "ok"); }
        catch { toast("Copy failed", "err"); }
        ta.remove();
      }
    );
  }
}

/* ============ Render: main ============ */
function render(){
  const vk = [state.page, state.src, activeTag, searchQuery, filterUnread, sortMode].join("|");
  if (vk !== render._vk){ render._vk = vk; visibleNewsCount = 50; }
  applyTheme();
  document.documentElement.dataset.density = density;
  document.documentElement.dataset.font = fontId === "sahel" ? "" : fontId;
  document.body.classList.toggle("grid", viewMode === "grid");
  document.body.classList.toggle("channel", viewMode === "channel");
  document.body.classList.toggle("newspaper", viewMode === "newspaper");
  document.documentElement.dataset.view = viewMode;
  renderSide();
  { const u = unreadTotal(); document.title = (u ? `(${u > 99 ? "99+" : u}) ` : "") + t("appTitle"); }
  $$("#tg button").forEach(b => b.classList.toggle("on", b.dataset.v === viewMode));
  $$("#densSeg button").forEach(b => b.classList.toggle("on", b.dataset.dens === density));
  $$("#sortSeg button").forEach(b => b.classList.toggle("on", b.dataset.sort === sortMode));
  $$("#filterSeg button").forEach(b => b.classList.toggle("on",
    b.dataset.filter === "unread" ? filterUnread : !filterUnread));
  const hideAllSeg = state.page === "add" || state.page === "stats" || state.page === "archive" || state.page === "digest";
  $("#tg").classList.toggle("hide", hideAllSeg);
  $("#densSeg").classList.toggle("hide", hideAllSeg || viewMode === "channel" || viewMode === "newspaper");
  $("#sortSeg").classList.toggle("hide", hideAllSeg);
  $("#filterSeg").classList.toggle("hide", hideAllSeg);
  $("#optsBtn").classList.toggle("hide", hideAllSeg);
  const view = $("#view");
  const oldEls = new Map();
  view.querySelectorAll("[data-recycle]").forEach(el => {
    oldEls.set(el.dataset.recycle, el);
  });
  let html, after;
  if (state.page === "add"){
    $("#ttl").textContent = t("addSourceTitle");
    const keep = $("#q") && $("#q").value;
    const keepTags = $("#addTags") && $("#addTags").value;
    if (keepTags != null) addTagsInputValue = keepTags;
    html = renderAddHTML();
    after = () => {
      if (keep){ const q = $("#q"); if (q) q.value = keep; }
      if (addTagsInputValue){ const at = $("#addTags"); if (at) at.value = addTagsInputValue; }
    };
  } else if (state.page === "saved"){
    $("#ttl").textContent = t("savedItems");
    html = renderNewsHTML();
    after = hydrateRec;
  } else if (state.page === "stats"){
    $("#ttl").textContent = t("statsTitle");
    html = renderStatsHTML();
    after = bindHeatmapTooltip;
  } else if (state.page === "digest"){
    $("#ttl").textContent = t("digestTitle");
    html = renderDigestHTML();
    after = null;
  } else if (state.page === "archive"){
    $("#ttl").textContent = t("archiveTitle");
    html = renderArchiveHTML();
    after = () => {
      const inp = $("#arcSearch");
      if (inp){
        inp.addEventListener("input", e => {
          archiveQuery = e.target.value;
          const tmp = document.createElement("div");
          tmp.innerHTML = renderArchiveHTML();
          const cur = document.querySelector("#view .archive-page");
          if (cur) cur.outerHTML = tmp.querySelector(".archive-page").outerHTML;
          const ni = $("#arcSearch");
          if (ni){ ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); }
        });
      }
    };
  } else {
    $("#ttl").textContent = state.src
      ? (sources.find(s => s.url === state.src) || {}).title || t("sourceWord")
      : t("mySourcesTitle");
    html = renderNewsHTML();
    after = hydrateRec;
  }
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("[data-recycle]").forEach(newEl => {
    const key = newEl.dataset.recycle;
    const oldEl = oldEls.get(key);
    if (!oldEl) return;
    if (oldEl.className !== newEl.className) return;
    const os = oldEl.querySelector("[data-save]");
    const ns = newEl.querySelector("[data-save]");
    if (os && ns){
      if (os.className !== ns.className) os.className = ns.className;
      const nsData = ns.getAttribute("data-save");
      if (nsData && os.getAttribute("data-save") !== nsData) os.setAttribute("data-save", nsData);
      const nsTitle = ns.getAttribute("title");
      if (nsTitle) os.setAttribute("title", nsTitle);
    }
    const newDir = newEl.getAttribute("dir");
    if (newDir) oldEl.setAttribute("dir", newDir);
    else oldEl.removeAttribute("dir");
    newEl.replaceWith(oldEl);
  });
  tmp.querySelectorAll(".card").forEach(el => {
    if (!oldEls.has(el.dataset.recycle)) el.classList.add("enter");
  });
  view.replaceChildren(...tmp.childNodes);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      view.querySelectorAll(".card.enter").forEach(el => el.classList.remove("enter"));
    });
  });
  after && after();
  if ((state.page === "news" || state.page === "saved") && liveTranslateAll){
  ensureLiveTranslations(filteredItems().slice(0, 60));
}
}

/* Bind heatmap cell tooltips */
function bindHeatmapTooltip(){
  const tip = $("#heatTooltip");
  if (!tip) return;
  document.querySelectorAll(".heat-cell[data-heat]").forEach(cell => {
    cell.addEventListener("mouseenter", () => {
      tip.textContent = (cell.dataset.date || "") + ": " + formatNum(cell.dataset.cnt || "0");
      tip.classList.add("on");
    });
    cell.addEventListener("mousemove", e => {
      tip.style.left = (e.clientX + 12) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    });
    cell.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
}

/* ============ Events: clicks ============ */
document.addEventListener("click", e => {
  const c = e.target.closest(".card[data-link], .ch-row[data-link], .np-hero[data-link], .np-sec[data-link], .np-head[data-link], .digest-item[data-link]");
  if (!c) return;
  if (e.target.closest("[data-save]")) return;
  if (e.target.closest("[data-share]")) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  if (e.button && e.button !== 0) return;

});
document.addEventListener("click", async e => {
  const more = e.target.closest("[data-load-more]");
  if (more){ visibleNewsCount += 50; render(); return; }
  const trd = e.target.closest("[data-today-read]");
  if (trd){ markItemsRead(todayQueue().shown); return; }
  const saveEl = e.target.closest("[data-save]");
  if (saveEl){
    e.preventDefault(); e.stopPropagation();
    try { toggleSave(JSON.parse(saveEl.dataset.save)); } catch {}
    return;
  }
  const shareEl = e.target.closest("[data-share]");
  if (shareEl){
    e.preventDefault(); e.stopPropagation();
    try {
      const data = JSON.parse(shareEl.dataset.share);
      openShareMenu(data.link, data.title, shareEl);
    } catch {}
    return;
  }
  /* archive page actions */
  const arcClearBtn = e.target.closest("#arcClear");
  if (arcClearBtn){
    askConfirm(t("archiveClearConfirm")).then(ok => { if (ok) clearArchive().then(() => { toast(t("archiveCleared"), "ok"); render(); }); });
    return;
  }
  const arcRm = e.target.closest("[data-arc-rm]");
  if (arcRm){
    removeFromArchive(arcRm.dataset.arcRm).then(() => render());
    toast(t("removedFromSaved"));
    return;
  }
  const arcOpenExt = e.target.closest("[data-arc-open-ext]");
  if (arcOpenExt){
    window.open(arcOpenExt.dataset.arcOpenExt, "_blank", "noopener");
    return;
  }
  const arcOpen = e.target.closest("[data-arc-open]");
  if (arcOpen){
    openReader(arcOpen.dataset.arcOpen);
    return;
  }
  const t2 = e.target.closest("[data-go],[data-src],[data-rm],[data-rsrc],[data-prev],[data-addrec],[data-v],[data-sort],[data-dens],[data-filter],[data-tag],[data-rmtag-toggle],[data-edittags],[data-renametag],[data-found],[data-share-action],[data-read-all],[data-close]");
  if (!t2) return;
  const d = t2.dataset;
  if ("close" in d){ t2.closest("dialog")?.close(); return; }
  if (d.shareAction){
    e.preventDefault();
    handleShareAction(d.shareAction, shareMenuState.link, shareMenuState.title);
    closeShareMenu();
    return;
  }
  const closeDrawerIfMobile = () => { if (drawer.isMobile()) drawer.close(); };
  if (d.v){ viewMode = d.v; store.set("view", viewMode); return render(); }
  if (d.dens){ density = d.dens; store.set("density", density); return render(); }
  if (d.sort){ sortMode = d.sort; store.set("sort", sortMode); return render(); }
  if (d.filter){ filterUnread = (d.filter === "unread"); store.set("filterUnread", filterUnread); return render(); }
  if (d.go){
    if (d.go === "stats"){ state.page = "stats"; state.src = null; closeDrawerIfMobile(); return render(); }
    if (d.go === "digest"){ state.page = "digest"; state.src = null; closeDrawerIfMobile(); return render(); }
    if (d.go === "archive"){
      state.page = "archive"; state.src = null;
      closeDrawerIfMobile();
      render();
      loadArchive().then(() => render());
      return;
    }
    state.page = d.go === "add" ? "add" : (d.go === "saved" ? "saved" : "news");
    state.src = null;
    closeDrawerIfMobile();
    if (state.page === "news") refreshAll();
    return render();
  }
  if (d.src){ state.page = "news"; state.src = d.src; closeDrawerIfMobile(); return render(); }
  if (d.rm){ removeSource(d.rm); closeDrawerIfMobile(); return; }
  if (d.rsrc){ const s = sources.find(x => x.url === d.rsrc); if (s){ delete articles[s.url]; loadSource(s).then(render); toast(t("refreshing")); } return; }
  if (d.tag != null){
    activeTag = (activeTag === d.tag) ? null : d.tag;
    store.set("activeTag", activeTag);
    state.src = null;
    if (state.page === "add" || state.page === "saved" || state.page === "archive" || state.page === "digest") state.page = "news";
    closeDrawerIfMobile();
    return render();
  }
  if (d.edittags){
    const s = sources.find(x => x.url === d.edittags);
    if (s) openTagsEditor(s);
    return;
  }
  if (d.renametag){
    const oldName = d.renametag;
    const newName = prompt(t("renameTagPrompt", {name: oldName}), oldName);
    if (newName != null){
      renameTag(oldName, newName);
      renderSide();
      if (state.src) render();
    }
    return;
  }
  if ("rmtagToggle" in d){
    groupByTags = !groupByTags;
    store.set("groupByTags", groupByTags);
    if (!groupByTags) activeTag = null;
    store.set("activeTag", activeTag);
    return render();
  }
  if ("readAll" in d){ markAllRead(); closeDrawerIfMobile(); return; }
  if (d.addrec){ const c0 = CATALOG.find(x => x.url === d.addrec); if (c0){
    const tagsInput = $("#addTags");
    const tags = (tagsInput && tagsInput.value.trim())
      ? tagsInput.value.split(",").map(x => x.trim()).filter(Boolean)
      : [];
    if (tags.length){ addTagsInputValue = ""; }
    const c = tags.length ? {...c0, tags} : c0;
    addSource(c); loadSource(c).then(render); toast(t("sourceAdded"), "ok"); renderSide();
  } return; }
  if (d.prev){
    const c = CATALOG.find(x => x.url === d.prev);
    if (!c) return;
    $("#pvTitle").textContent = c.title;
    $("#pvBody").innerHTML = `<div class="meta">${esc(t("readerLoading"))}</div>`;
    $("#previewDlg").showModal();
    try {
      const f = parseFeed(await fetchText(c.url));
      $("#pvBody").innerHTML = `<ul dir="auto">` +
        f.items.slice(0, 8).map(i => `<li><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a></li>`).join("") + `</ul>`;
    } catch {
      $("#pvBody").innerHTML = `<div class="meta" style="color:var(--red)">${esc(t("readerErr"))}</div>`;
    }
  }
});

/* ============ Events: input / search ============ */
let searchTimer;
let discoverTimer = null;
let discoverSeq = 0;
const searchInput = $("#search");
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  $("#searchClear").hidden = !searchQuery;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { if (searchQuery.trim() && state.page === "digest") state.page = "news"; if (state.page === "news" || state.page === "saved") render(); }, 180);
});
$("#searchClear").addEventListener("click", () => {
  searchInput.value = ""; searchQuery = ""; $("#searchClear").hidden = true; render(); searchInput.focus();
});
document.addEventListener("input", e => {
  if (e.target.id === "proxy"){ store.set("proxy", e.target.value.trim()); return; }
  if (e.target.id === "addTags"){ addTagsInputValue = e.target.value; return; }
  if (e.target.id !== "q") return;
  clearTimeout(discoverTimer);
  discoverToken++;
  const v = e.target.value, my = ++discoverSeq, box = $("#found");
  if (!v.trim()){ box.innerHTML = ""; return; }
  discoverTimer = setTimeout(async () => {
    if (!normalizeUrl(v)){
      const hits = CATALOG.filter(c => c.title.toLowerCase().includes(v.toLowerCase()));
      box.innerHTML = hits.length
        ? hits.map(c => `<div class="row"><span class="grow">${esc(c.title)}</span><button class="lnk" data-addrec="${esc(c.url)}">${esc(t("add"))}</button></div>`).join("")
        : `<span class="err">${esc(t("noMatchCatalog"))}</span>`;
      return;
    }
    box.innerHTML = `<div class="found-head"><span class="stat">${esc(t("lookingForFeeds"))}</span></div>`;
    let res;
    try {
      res = await discover(v, (msg, list) => {
        if (my !== discoverSeq) return;
        if (list){
          renderFoundFeeds(box, list, null);
        } else if (msg){
          box.innerHTML = `<div class="found-head"><span class="stat">${esc(msg)}</span></div>`;
        }
      });
    } catch (err){
      if (my === discoverSeq) box.innerHTML = `<span class="err">${esc(t("feedNotFound"))}</span>`;
      return;
    }
    if (my !== discoverSeq) return;
    if (!res.length){
      box.innerHTML = `<div class="err">${esc(t("feedNotFound"))}</div>
        <div class="row"><span class="meta" style="font-size:11px;line-height:1.6;display:block">${esc(t("proxyHelp"))}</span></div>`;
      return;
    }
    renderFoundFeeds(box, res, null);
  }, 450);
});
function renderFoundFeeds(box, list, statusMsg){
  const addedCount = list.filter(r => sources.some(s => s.url === r.url)).length;
  const canAddAll = (list.length - addedCount) > 1;
  const headerText = statusMsg
    ? statusMsg
    : (appLang === "fa"
        ? `${formatNum(list.length)} فید پیدا شد${addedCount ? ` — ${formatNum(addedCount)} افزوده‌شده` : ""}`
        : `${formatNum(list.length)} feed(s) found${addedCount ? ` — ${formatNum(addedCount)} added` : ""}`);
  const head = `<div class="found-head">
    <span class="stat">${esc(headerText)}</span>
    ${canAddAll ? `<button class="btn small" id="addAllFound">${esc(appLang === "fa" ? "افزودن همه" : "Add all")}</button>` : ""}
  </div>`;
  const items = list.map(r => {
    const has = sources.some(s => s.url === r.url);
    let host = "";
    try { host = new URL(r.url).hostname.replace(/^www\./, "") } catch {}
    const kind = r.kind || "RSS";
    const count = r.count || 0;
    const title = r.title || host || r.url;
    return `<div class="feed-row ${has ? "added" : ""}">
      <div class="feed-info">
        <div class="feed-title" dir="auto">${esc(title)}</div>
        <div class="feed-meta">
          <span class="feed-kind">${esc(kind)}</span>
          <span class="feed-url" dir="ltr" title="${escAttr(r.url)}">${esc(r.url)}</span>
          ${count ? `<span class="feed-count">· ${formatNum(count)} ${appLang === "fa" ? "خبر" : "items"}</span>` : ""}
        </div>
      </div>
      ${has
        ? `<span class="feed-added">✓ ${esc(t("added"))}</span>`
        : `<button class="btn small" data-found='${escAttr(JSON.stringify({url: r.url, title: r.title}))}'>${esc(t("add"))}</button>`}
    </div>`;
  }).join("");
  box.innerHTML = head + `<div class="feed-list">${items}</div>`;
  const addAllBtn = document.getElementById("addAllFound");
  if (addAllBtn){
    addAllBtn.addEventListener("click", () => {
      const tagsInput = $("#addTags");
      const tags = (tagsInput && tagsInput.value.trim())
        ? tagsInput.value.split(",").map(x => x.trim()).filter(Boolean)
        : [];
      if (tags.length) addTagsInputValue = "";
      let added = 0;
      for (const r of list){
        if (sources.some(s => s.url === r.url)) continue;
        const s = { url: r.url, title: r.title, tags };
        addSource(s);
        loadSource(s);
        added++;
      }
      if (added){ toast(t("sourceAdded"), "ok"); renderSide(); }
      setTimeout(() => renderFoundFeeds(box, list, null), 0);
    });
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-found]"); if (!b) return;
  const s = JSON.parse(b.dataset.found);
  const tagsInput = $("#addTags");
  if (tagsInput && tagsInput.value.trim()){
    s.tags = tagsInput.value.split(",").map(x => x.trim()).filter(Boolean);
    addTagsInputValue = "";
  }
  addSource(s); loadSource(s).then(render);
  b.outerHTML = `<span class="meta" style="color:var(--green)">${esc(t("added"))}</span>`;
  renderSide();
});

/* ============ Options popover, shortcuts help, confirm dialog ============ */
function openKeys(){
  const fa = appLang === "fa";
  const rows = [["/", fa ? "جستجو" : "Search"], ["r", fa ? "تازه‌سازی همه" : "Refresh all"], ["t", fa ? "تغییر تم" : "Switch theme"],
    ["u", fa ? "فقط خوانده‌نشده‌ها" : "Unread only"], ["l  g  c  n", fa ? "نمای کارت، شبکه، تیتر، روزنامه" : "Cards, grid, headlines, newspaper"],
    ["d", fa ? "خلاصه" : "Digest"], ["a", fa ? "آرشیو" : "Archive"], ["j  k", fa ? "خبر بعدی و قبلی هنگام خواندن" : "Next and previous while reading"],
    ["Esc", fa ? "بستن یا پاک‌کردن جستجو" : "Close or clear search"], ["?", fa ? "این راهنما" : "This help"]];
  $("#keysTitle").textContent = fa ? "میانبرهای کیبورد" : "Keyboard shortcuts";
  $("#keysBody").innerHTML = `<div class="keys">${rows.map(([k, v]) => `<kbd>${esc(k)}</kbd><span>${esc(v)}</span>`).join("")}</div>`;
  $("#keysClose").textContent = fa ? "بستن" : "Close";
  $("#keysDlg").showModal();
}
function askConfirm(msg){
  return new Promise(res => {
    const fa = appLang === "fa", d = document.createElement("dialog");
    d.innerHTML = `<div class="dlg-body"><p style="margin:0;line-height:1.9"></p></div><div class="dlg-foot"><button class="btn ghost"></button><button class="btn" style="background:var(--red)"></button></div>`;
    d.querySelector("p").textContent = msg;
    const [no, ok] = d.querySelectorAll("button"); let r = false;
    no.textContent = fa ? "انصراف" : "Cancel"; ok.textContent = fa ? "تأیید" : "Confirm";
    ok.onclick = () => { r = true; d.close(); }; no.onclick = () => d.close();
    d.addEventListener("close", () => { d.remove(); res(r); });
    document.body.appendChild(d); d.showModal(); no.focus();
  });
}
(function setupOpts(){
  const b = $("#optsBtn"), p = $("#optsPop");
  const set = o => { p.hidden = !o; b.setAttribute("aria-expanded", String(o)); };
  b.addEventListener("click", e => {
    e.stopPropagation();
    if (p.hidden){
      const fa = appLang === "fa";

      $("#optDensLbl").textContent = fa ? "تراکم" : "Density";

      b.title = fa ? "گزینه‌های نمایش" : "View options";

    set(p.hidden);
  });

  document.addEventListener("keydown", e => { if (e.key === "Escape") set(false); });

/* ============ Auto refresh ============ */
function setupAuto(){

/* ============ Sidebar resizer (desktop) ============ */
(function setupResizer(){
  const aside = $("#side");
  const rz = $("#sideResizer");
  if (!aside || !rz) return;
  const MIN_W = 170, MAX_W = 480, DEFAULT_W = 250;
  let sideW = store.get("sideW", DEFAULT_W);
  const apply = w => {
    sideW = Math.max(MIN_W, Math.min(MAX_W, w));
    document.documentElement.style.setProperty("--side-w", sideW + "px");
  };
  apply(sideW);
  let drag = false, startX = 0, startW = 0;
  const start = e => {
    if (window.matchMedia("(max-width: 820px)").matches) return;
    drag = true;
    rz.classList.add("dragging");
    startX = (e.touches ? e.touches[0] : e).clientX;
    startW = aside.offsetWidth;
    document.body.style.userSelect = "none";
    document.body.style.cursor = "col-resize";
    if (e.cancelable) e.preventDefault();
  };
  const move = e => {
    if (!drag) return;
    const x = (e.touches ? e.touches[0] : e).clientX;
    const dx = x - startX;
    const rtl = document.documentElement.dir === "rtl";
    apply(startW + (rtl ? -dx : dx));
    if (e.cancelable) e.preventDefault();
  };
  const end = () => {
    if (!drag) return;
    drag = false;
    rz.classList.remove("dragging");
    document.body.style.userSelect = "";
    document.body.style.cursor = "";
    store.set("sideW", sideW);
  };
  rz.addEventListener("mousedown", start);
  rz.addEventListener("touchstart", start, {passive:false});
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, {passive:false});
  document.addEventListener("mouseup", end);
  document.addEventListener("touchend", end);
  document.addEventListener("touchcancel", end);
  rz.addEventListener("dblclick", () => { apply(DEFAULT_W); store.set("sideW", sideW); });
})();

/* ============ Keyboard shortcuts ============ */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#reader").hidden){
    e.preventDefault();
    history.back();
    return;
  }
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if (e.key === "Escape"){
    if (document.body.classList.contains("side-open")){ drawer.close(); return; }
    if (searchQuery){ searchInput.value=""; searchQuery=""; $("#searchClear").hidden=true; render(); }
    return;
  }
  if (typing) return;
  if (e.key === "?" || e.key === "؟"){ e.preventDefault(); openKeys(); return; }
  if (!$("#reader").hidden){
    if (e.key === "j" || e.key === "J"){ e.preventDefault(); navigateReader(1); return; }
    if (e.key === "k" || e.key === "K"){ e.preventDefault(); navigateReader(-1); return; }
  }
  if (e.key === "/"){ e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
  if (e.key === "r" || e.key === "R"){ e.preventDefault(); refreshAll(); return; }
  if (e.key === "t" || e.key === "T"){ e.preventDefault(); $("#themeBtn").click(); return; }
  if (e.key === "u" || e.key === "U"){ e.preventDefault(); filterUnread = !filterUnread; store.set("filterUnread", filterUnread); render(); return; }
  if (e.key === "g" || e.key === "G"){ viewMode = "grid"; store.set("view", viewMode); render(); return; }
  if (e.key === "l" || e.key === "L"){ viewMode = "list"; store.set("view", viewMode); render(); return; }
  if (e.key === "c" || e.key === "C"){ viewMode = "channel"; store.set("view", viewMode); render(); return; }
  if (e.key === "n" || e.key === "N"){ viewMode = "newspaper"; store.set("view", viewMode); render(); return; }
  if (e.key === "d" || e.key === "D"){ e.preventDefault(); state.page = "digest"; state.src = null; render(); return; }
  if (e.key === "a" || e.key === "A"){ e.preventDefault(); state.page = "archive"; state.src = null; render(); loadArchive().then(() => render()); return; }
});
function navigateReader(direction){
  const items = filteredItems();
  if (!items.length) return;
  const currentIdx = items.findIndex(a => a.link === readerCurrentLink);
  if (currentIdx === -1){
    if (items[0]) openReader(items[0].link);
    return;
  }
  const newIdx = currentIdx + direction;
  if (newIdx < 0 || newIdx >= items.length) return;
  const next = items[newIdx];
  if (!next) return;
  openReader(next.link);
}

/* ============ Swipe-to-close drawer (mobile) ============ */
(function setupSwipeClose(){
  let sx = 0, sy = 0, tracking = false;
  const aside = $("#side");
  if (!aside) return;
  aside.addEventListener("touchstart", e => {
    if (!document.body.classList.contains("side-open")) return;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; tracking = true;
  }, {passive:true});
  aside.addEventListener("touchmove", e => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    const rtl = document.documentElement.dir === "rtl";
    const out = rtl ? -dx : dx;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) && out > 0){
      drawer.close();
      tracking = false;
    }
  }, {passive:true});
  aside.addEventListener("touchend", () => { tracking = false; }, {passive:true});
})();

(function setupPWA(){
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="120" fill="hsl(${accentH}, 91%, 60%)"/><path d="M392 114 335 383c-4 19-16 24-32 15l-89-66-43 41c-5 5-9 9-19 9l6-91 166-150c7-6-2-9-11-3L108 270l-88-28c-19-6-19-19 4-28L360 77c16-6 38 4 32 37Z" fill="#fff" transform="translate(60 12) scale(.88)"/></svg>`;
  const iconUrl = "data:image/svg+xml;utf8," + encodeURIComponent(svgIcon);
  const manifest = {
    name: "Personal news", short_name: "News", description: "A single-file RSS/Atom reader",
    start_url: "./", scope: "./", display: "standalone",
    background_color: "#eef2f8", theme_color: effectiveTheme() === "dark" ? "#0f1420" : "#eef2f8",
    icons: [
      { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
      { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", () => {

  }
})();
