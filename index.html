<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8">
<title>Personal news</title>
<link rel="manifest" id="manifestLink">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@alwatr/font@0.21.0/sahel.min.css" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iransans-fontface@0.1.1/css/iransans/iransans-fontface.min.css" fetchpriority="low">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/vazirmatn@5.3.0/index.min.css" fetchpriority="low">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v4.0.5/dist/font-face.css" fetchpriority="low">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css" fetchpriority="low">

<style>
*{box-sizing:border-box}
:root{
  color-scheme:light;
  /* Accent hue — every primary shade below derives from this single number,
     so the whole palette can be re-tinted at runtime. */
  --accent-h:217;
  --blue:hsl(var(--accent-h) 91% 60%);
  --blue-2:hsl(var(--accent-h) 91% 50%);
  --blue-soft:hsl(var(--accent-h) 91% 96%);
  --blue-glow:hsl(var(--accent-h) 91% 60% / .18);
  --accent-grad:linear-gradient(135deg,hsl(var(--accent-h) 91% 63%),hsl(var(--accent-h) 91% 49%));

  --bg:#eef2f8;--bg-soft:#ffffff;
  --panel:#ffffff;--panel-2:#fafbfd;--panel-hover:#f5f7fb;
  --line:#e3e8f0;--line-2:#d0d8e6;
  --text:#1a1f36;--text-dim:#6b7280;--mute:#9ca3af;
  --red:#ef4444;--green:#10b981;--amber:#f59e0b;--star:#f59e0b;
  --shadow:0 6px 24px rgba(15,23,42,.06);
  --shadow-lg:0 20px 60px rgba(15,23,42,.18);
  --toast-bg:#1a1f36;--toast-text:#ffffff;
  --heat-1:hsl(var(--accent-h) 91% 90%);
  --heat-2:hsl(var(--accent-h) 91% 76%);
  --radius:16px;--radius-sm:10px;
  --t:.2s cubic-bezier(.4,0,.2,1);
  --header-h:60px;
  --header-bg:rgba(255,255,255,.88);
  --skeleton:linear-gradient(90deg,#f1f5fa 0%,#e4ebf5 50%,#f1f5fa 100%);
  --rd-size:17px;
  --side-w:250px;
  --font-sahel:  "Sahel", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-iransans:"IRANSans", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-vazir:  "Vazirmatn", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-samim:  "Samim", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-shabnam:"Shabnam", "Tahoma", "Segoe UI", system-ui, sans-serif;
  --font-system: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Tahoma", sans-serif;
  --font-app: var(--font-sahel);
  --font-reader: var(--font-sahel);
}
[data-font="iransans"]{ --font-app:var(--font-iransans); --font-reader:var(--font-iransans); }
[data-font="vazir"]   { --font-app:var(--font-vazir);    --font-reader:var(--font-vazir); }
[data-font="samim"]   { --font-app:var(--font-samim);    --font-reader:var(--font-samim); }
[data-font="shabnam"] { --font-app:var(--font-shabnam);  --font-reader:var(--font-shabnam); }
[data-font="system"]  { --font-app:var(--font-system);   --font-reader:var(--font-system); }
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1420;--bg-soft:#1a2030;
  --panel:#1a2030;--panel-2:#1e2536;--panel-hover:#232b3d;
  --line:#2a3346;--line-2:#3a4560;
  --text:#e8edf5;--text-dim:#94a3b8;--mute:#64748b;
  --blue:hsl(var(--accent-h) 80% 70%);
  --blue-2:hsl(var(--accent-h) 80% 80%);
  --blue-soft:hsl(var(--accent-h) 40% 18%);
  --blue-glow:hsl(var(--accent-h) 80% 70% / .2);
  --accent-grad:linear-gradient(135deg,hsl(var(--accent-h) 80% 72%),hsl(var(--accent-h) 80% 54%));
  --red:#f87171;--green:#34d399;--amber:#fbbf24;--star:#fbbf24;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55);
  --toast-bg:#e8edf5;--toast-text:#0f1420;
  --heat-1:hsl(var(--accent-h) 40% 26%);
  --heat-2:hsl(var(--accent-h) 45% 40%);
  --header-bg:rgba(15,20,32,.88);
  --skeleton:linear-gradient(90deg,#1e2536 0%,#28324a 50%,#1e2536 100%);
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 var(--font-app);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background var(--t),color var(--t);
  min-height:100vh;
}
body.reader-open{overflow:hidden}
button{font-family:inherit}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

header{
  position:sticky;top:0;z-index:90;
  height:var(--header-h);display:flex;align-items:center;gap:16px;
  padding:0 18px;
  background:var(--header-bg);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
  transition:background var(--t),border-color var(--t);
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:26px;height:26px;border-radius:50%;border:4px solid var(--red);position:relative;box-shadow:0 0 0 2px rgba(255,27,45,.12)}
.logo::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--red);opacity:.15}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap}
@media(max-width:640px){header h1{display:none}}

.search-wrap{flex:1;max-width:520px;position:relative;margin:0 auto;display:flex;align-items:center}
.search{
  width:100%;height:36px;border-radius:18px;border:1px solid var(--line-2);
  background:var(--bg-soft);color:var(--text);
  padding-inline-start:36px;padding-inline-end:38px;
  font-size:13px;outline:none;
  transition:border-color var(--t),background var(--t),box-shadow var(--t);
}
.search::placeholder{color:var(--mute)}
.search:focus{border-color:var(--blue);background:var(--panel);box-shadow:0 0 0 3px var(--blue-soft)}
.search-icon{position:absolute;inset-inline-start:12px;color:var(--mute);font-size:15px;pointer-events:none;line-height:1}
.search-clear{position:absolute;inset-inline-end:8px;width:22px;height:22px;border-radius:50%;border:0;background:var(--panel-2);color:var(--text-dim);cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.search-clear:hover{background:var(--panel-hover);color:var(--text)}

.head-actions{display:flex;gap:4px;flex:none}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background var(--t),color var(--t),transform var(--t)}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.menu-btn{display:none}

.layout{display:flex;min-height:calc(100vh - var(--header-h))}
aside{
  width:var(--side-w,250px);
  flex:none;
  padding:20px 12px 30px;
  position:sticky;top:var(--header-h);
  height:calc(100vh - var(--header-h));
  overflow-y:auto;scrollbar-width:thin;
}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}

.side-resizer{
  flex:none;
  width:5px;
  cursor:col-resize;
  background:transparent;
  position:relative;
  z-index:5;
  transition:background var(--t);
  touch-action:none;
}
.side-resizer::before{
  content:"";
  position:absolute;
  top:0;bottom:0;left:0;right:0;
  margin:0 auto;
  width:1px;
  background:var(--line);
  transition:background var(--t),width var(--t);
}
.side-resizer:hover::before,
.side-resizer.dragging::before{
  background:var(--blue);
  width:2px;
}
.side-resizer.dragging{ background:var(--blue-soft); }

.side-backdrop{display:none}

.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-dim);text-decoration:none;cursor:pointer;font-size:13px;transition:background var(--t),color var(--t);user-select:none}
.nav-link:hover{background:var(--panel-2);color:var(--text)}
.nav-link.on{background:var(--blue-soft);color:var(--blue);font-weight:500}
.nav-link .ico{width:16px;text-align:center;font-size:13px;opacity:.9;flex:none}
.nav-link .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-link .badge{flex:none;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--panel-2);color:var(--text-dim);font-weight:500}
.nav-link.on .badge{background:var(--blue);color:#fff}

aside .grp{margin:20px 10px 6px;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
aside .grp button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:0;flex:none}
aside .grp button:hover{color:var(--blue)}

.src-row{display:flex;align-items:center;gap:4px;border-radius:var(--radius-sm);transition:background var(--t)}
.src-row:hover{background:var(--panel-2)}
.src-row .nav-link{flex:1;min-width:0;background:transparent!important}
.src-row .nav-link:hover{background:transparent}
.src-row .mini{width:30px;height:30px;border-radius:6px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--t),background var(--t),color var(--t);flex:none}
.src-row:hover .mini{opacity:1}
.src-row .mini:hover{background:var(--panel-hover);color:var(--text)}
.src-row .mini.rm:hover{color:var(--red)}
.src-row .mini.tag-edit{font-size:11px}
.src-row .mini.tag-edit:hover{color:var(--blue)}

#filterSeg button{font-size:13px;line-height:1}
#filterSeg button[data-filter="unread"].on{background:var(--amber);color:#1a1a1a}
#filterSeg button[data-filter="all"].on{background:var(--blue);color:#fff}

.tag-pills{display:flex;flex-wrap:wrap;gap:4px;padding-inline:6px;align-items:center;flex:none;max-width:140px;overflow:hidden}
.tag-pill{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--panel-2);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tag-link .ico{font-weight:700;opacity:.8}
.tag-link.on .ico{opacity:1}

.tag-link{position:relative}
.tag-link .tag-ren{position:absolute;inset-inline-end:34px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:11px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--t),color var(--t)}
.tag-link:hover .tag-ren{opacity:.7}
.tag-link .tag-ren:hover{opacity:1;color:var(--blue);background:var(--panel-hover)}

.src-grp{margin-block:4px}
.src-grp > .src-grp-h{display:flex;align-items:center;gap:8px;padding:4px 10px 2px;color:var(--blue);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:var(--radius-sm);transition:background var(--t)}
.src-grp > .src-grp-h:hover{background:var(--panel-2)}
.src-grp > .src-grp-h.muted{color:var(--mute);text-transform:none;font-weight:500;font-size:11px}
.src-grp > .src-grp-h .ico{opacity:.7}

.tag-ed-source{font-weight:600;font-size:15px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);direction:ltr}
.tag-suggestions{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-suggest{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--blue-soft);color:var(--blue);border:1px solid transparent;cursor:pointer;transition:background var(--t),border-color var(--t)}
.tag-suggest:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag-help{color:var(--mute);font-size:11px;margin-top:10px;line-height:1.5}

.newspaper{max-width:1100px;margin:0 auto}
.np-row-main{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:760px){.np-row-main{grid-template-columns:1fr}}
.np-hero{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;color:inherit;text-decoration:none;position:relative;transition:transform var(--t),border-color var(--t),box-shadow var(--t);min-height:300px}
.np-hero:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.np-hero.read{opacity:.6}
.np-hero-img{height:200px;background:var(--panel-2) center/cover no-repeat;border-bottom:1px solid var(--line)}
.np-hero-body{padding:18px 22px 22px;position:relative}
.np-hero-title{font-size:24px;font-weight:700;line-height:1.35;margin:6px 0 10px;letter-spacing:-.2px}
.np-hero-summary{color:var(--text-dim);font-size:14px;line-height:1.7;margin:0;max-height:80px;overflow:hidden}
.np-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.np-meta b{color:var(--blue);font-weight:500}
.np-meta .tm{color:var(--mute)}

.np-sec-col{display:flex;flex-direction:column;gap:14px}
.np-sec{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;color:inherit;text-decoration:none;padding:0;transition:transform var(--t),border-color var(--t),box-shadow var(--t);min-height:120px;position:relative}
.np-sec:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.np-sec.read{opacity:.6}
.np-sec.no-img{padding:14px}
.np-sec-img{width:110px;flex:none;background:var(--panel-2) center/cover no-repeat}
.np-sec-body{padding:12px 14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;position:relative}
.np-sec-title{font-size:15px;font-weight:600;line-height:1.4;margin:2px 0 0;color:var(--text)}
.np-hero .save-btn,.np-sec .save-btn{position:absolute;inset-inline-end:10px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--panel-2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0;transition:opacity var(--t),background var(--t),color var(--t)}
.np-hero:hover .save-btn,.np-sec:hover .save-btn{opacity:1}
.np-hero .save-btn:hover,.np-sec .save-btn:hover{background:var(--panel-hover);color:var(--star)}
.np-hero .save-btn.on,.np-sec .save-btn.on{opacity:1;color:var(--star)}

.np-headlines{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:24px}
.np-headlines h4{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.np-head{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:13px;transition:background var(--t);border-radius:4px;position:relative}
.np-head:last-child{border-bottom:0}
.np-head:hover{background:var(--panel-2)}
.np-head.read{opacity:.55}
.np-head-src{font-size:11px;color:var(--blue);font-weight:500;flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-head-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.np-head-time{font-size:11px;color:var(--mute);flex:none}
.np-head .save-btn{width:24px;height:24px;font-size:12px;color:var(--text-dim);background:transparent;display:flex;align-items:center;justify-content:center;flex:none;opacity:0;transition:opacity var(--t)}
.np-head:hover .save-btn{opacity:.8}
.np-head .save-btn:hover{color:var(--star);opacity:1}
.np-head .save-btn.on{opacity:1;color:var(--star)}
@media(max-width:760px){
  .np-hero{min-height:auto}
  .np-hero-img{height:160px}
  .np-hero-title{font-size:19px}
  .np-sec-img{width:90px}
  .np-head-title{white-space:normal}
}

.stats-page{max-width:920px;margin:0 auto}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;border-inline-start:3px solid var(--accent);transition:transform var(--t),box-shadow var(--t)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card.hero{padding:22px;background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%)}
.stat-val{font-size:30px;font-weight:700;color:var(--accent);letter-spacing:-.5px;line-height:1.1}
.stat-card.hero .stat-val{font-size:36px}
.stat-lbl{font-size:11px;color:var(--mute);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.stat-sub{font-size:11px;color:var(--text-dim);margin-top:4px}
.stats-section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:18px}
.stats-section h3{font-size:14px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stat-streak-pill{font-size:12px;padding:2px 10px;border-radius:11px;background:var(--amber);color:#1a1a1a;font-weight:600}

.stats-foot{font-size:11px;color:var(--mute);margin:8px 0 0;line-height:1.5}

.top-sources{display:flex;flex-direction:column;gap:8px}
.ts-row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;transition:background var(--t)}
.ts-row:hover{background:var(--panel-2)}
.ts-rank{width:22px;height:22px;border-radius:50%;background:var(--panel-2);color:var(--text-dim);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.ts-row:first-child .ts-rank{background:var(--amber);color:#1a1a1a}
.ts-row:nth-child(2) .ts-rank{background:var(--text-dim);color:var(--bg)}
.ts-row:nth-child(3) .ts-rank{background:var(--blue-2);color:#fff}
.ts-name{flex:1;min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-bar{flex:none;width:120px;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.ts-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue-2),var(--blue));border-radius:3px;transition:width var(--t)}
.ts-count{flex:none;font-size:12px;color:var(--text-dim);font-weight:500;min-width:30px;text-align:end}
.empty-row{padding:20px;text-align:center;color:var(--mute);font-size:13px}
@media(max-width:560px){
  .stat-val{font-size:24px}
  .stat-card.hero .stat-val{font-size:28px}
  .ts-bar{width:80px}
}

.card-action.share-btn{position:absolute;inset-inline-end:38px;top:0;width:34px;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim);background:transparent;cursor:pointer;opacity:0;transition:opacity var(--t),color var(--t);flex:none;border:0}
.card:hover .card-action.share-btn{opacity:.7}
.card-action.share-btn:hover{opacity:1;color:var(--blue)}
@media(max-width:760px){.card-action.share-btn{opacity:.7}}

.share-menu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);min-width:180px;padding:6px;display:none;flex-direction:column;gap:2px}
.share-menu.open{display:flex}
.share-menu button{display:flex;align-items:center;gap:10px;padding:8px 12px;border:0;background:transparent;color:var(--text);cursor:pointer;border-radius:6px;font-size:13px;text-align:start;width:100%;transition:background var(--t)}
.share-menu button:hover{background:var(--panel-2)}
.share-menu .ico{font-size:15px;width:20px;text-align:center;flex:none;color:var(--blue)}

.src-fav{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.src-favicon{width:16px;height:16px;border-radius:3px;display:inline-block;vertical-align:middle}
.src-favicon.placeholder{font-size:14px;color:var(--mute);line-height:18px}

#rdTTS, #rdShare{position:relative}
#rdTTS.active{color:var(--blue);background:var(--blue-soft)}
#rdTTS.active::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--blue);opacity:.4}
#rdTranslate{position:relative}
#rdTranslate.active{color:var(--blue);background:var(--blue-soft)}
#rdTranslate.active::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--blue);opacity:.4}
#rdTranslate.loading{pointer-events:none;opacity:.6}
/* ============ Live translation (main page) ============ */
#liveTranslateBtn.on{color:var(--blue);background:var(--blue-soft);position:relative}
#liveTranslateBtn.on::after{content:"";position:absolute;inset:0;border-radius:10px;border:1px solid var(--blue);opacity:.4}
#liveTranslateBtn.busy::after{animation:trPulse 1.4s ease-in-out infinite}
@keyframes trPulse{0%,100%{opacity:.15}50%{opacity:.6}}

main{flex:1;padding-block:22px 80px;padding-inline:26px;min-width:0}

.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.title-wrap{display:flex;align-items:baseline;gap:10px;min-width:0}
.top h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.2px}
.count{font-size:12px;color:var(--mute)}
.tact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.seg{display:flex;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.seg button{min-width:32px;height:28px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px;transition:background var(--t),color var(--t)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--blue);color:#fff}
.seg.hide{display:none}

.feed{max-width:920px;margin:28px auto 0}
.feed h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.feed h3::after{content:"";flex:1;height:1px;background:var(--line)}
.feed h3:first-child{margin-top:6px}

.card{display:flex;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;color:inherit;text-decoration:none;height:160px;overflow:hidden;position:relative;border-radius:var(--radius);opacity:1;transition:transform var(--t),border-color var(--t),background var(--t),box-shadow var(--t),opacity .28s ease}
.card.enter{opacity:0;transform:translateY(6px)}
.card:hover{background:var(--panel-2);border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.card.read{opacity:.62}
.card.read .t{color:var(--text-dim)}
.card .im{width:250px;flex:none;background:var(--panel-2) center/cover no-repeat;position:relative}
.card .bd{padding:14px 18px;min-width:0;flex:1;display:flex;flex-direction:column;gap:6px;position:relative}
.meta{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta b{color:var(--blue);font-weight:600}
.meta .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block;flex:none}
.card.read .meta .dot{background:var(--mute);opacity:.5}
.card .t{font-size:15.5px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.1px}
.card .s{color:var(--mute);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:auto}
.save-btn{position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;background:transparent;border:0;opacity:0;transition:opacity var(--t),color var(--t),background var(--t),transform var(--t)}
.card:hover .save-btn{opacity:1}
.save-btn:hover{background:var(--panel-hover);color:var(--text);transform:scale(1.08)}
.save-btn.on{opacity:1;color:var(--star)}

.grid .feed{max-width:1320px}
.feed{container-type:inline-size}
.row{display:flex;flex-wrap:wrap;margin:0 -8px 6px;--ih:calc(100cqw * .27)}
.row>.card,.row>.stack{flex:1 1 0;min-width:0;margin:8px}
.row .card{flex-direction:column;height:auto}
.row .card .im{width:100%;height:var(--ih);flex:none}
.row .card .bd{height:150px;flex:none;overflow:hidden}
.row .card .t{-webkit-line-clamp:2}
.row .card .s{-webkit-line-clamp:2}
.row .card.tx .bd{height:auto;flex:1}
.row .card.tx .t{-webkit-line-clamp:4}
.row.b>:nth-child(1),.row.b>:nth-child(2){flex-grow:2}
.row.c{--ih:calc(100cqw * .19)}
.row.c.tt .card{height:130px}
.card.tx .meta{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.card.tx .tm{display:none}
.row.c.tt .bd{padding:10px 12px}
.row.c.tt .t{font-size:13px;-webkit-line-clamp:3}
.row.c.tt .s{-webkit-line-clamp:1;font-size:11px}
.stack{display:flex;flex-direction:column}
.stack .card{flex:1 1 0;min-height:0;margin:0 0 14px}
.stack .card:last-child{margin-bottom:0}
.stack .s{display:none}
.stack .card.tx .t{-webkit-line-clamp:3}

@container (max-width:600px){
  .row{--ih:calc(100cqw * .42)}
  .row>.card{flex:1 1 calc(50% - 16px)}
  .row.a>.card:nth-child(3){flex:1 1 calc(100% - 16px);flex-direction:row}
  .row.a>.card:nth-child(3) .im{width:50%;height:auto}
  .row.b>.stack{flex:1 1 calc(100% - 16px);flex-direction:row;flex-wrap:wrap}
  .row.b .stack .card{flex:1 1 40%;height:150px;margin:0 8px 8px}
  .row.c.tt .card{height:150px}
}

body.grid .row > .card{flex-direction:column;height:auto;overflow:hidden}
body.grid .row > .card .im{width:100%;height:var(--ih);flex:none}
body.grid .row > .card .bd{padding:12px 14px;gap:5px;height:auto;min-height:0;flex:1 1 auto;overflow:hidden;min-width:0}

[data-density="compact"] body.grid .row{--ih:calc(100cqw * .18);margin:0 -5px 6px}
[data-density="compact"] body.grid .row.c{--ih:calc(100cqw * .13)}
[data-density="compact"] body.grid .row > .card{margin:5px}
[data-density="compact"] body.grid .row > .card .bd{padding:8px 10px;gap:3px}
[data-density="compact"] body.grid .row > .card .t{font-size:12.5px;line-height:1.4;-webkit-line-clamp:2}
[data-density="compact"] body.grid .row > .card.tx .t{-webkit-line-clamp:3}
[data-density="compact"] body.grid .row > .card .s{font-size:11px;-webkit-line-clamp:1;margin-top:0}
[data-density="compact"] body.grid .row > .card.m .s{display:none}
[data-density="compact"] body.grid .row > .card .meta{font-size:10px;gap:4px}
[data-density="compact"] body.grid .row.c.tt > .card{height:auto;min-height:80px}
[data-density="compact"] body.grid .row.c.tt > .card .t{font-size:12px;-webkit-line-clamp:2}
[data-density="compact"] body.grid .row.c.tt > .card .s{display:none}
[data-density="compact"] body.grid .stack .card{margin:0 0 8px}
[data-density="compact"] body.grid .stack .card:last-child{margin-bottom:0}

[data-density="compact"] .feed > .card{height:110px;margin-bottom:10px}
[data-density="compact"] .feed > .card .im{width:170px}
[data-density="compact"] .feed > .card .bd{padding:10px 14px;gap:4px}
[data-density="compact"] .feed > .card .t{font-size:14px;-webkit-line-clamp:2}
[data-density="compact"] .feed > .card .s{font-size:12px;-webkit-line-clamp:2}
[data-density="compact"] .feed > .card.m .s{display:none}

.channel-list{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;margin-bottom:14px}
.ch-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;transition:background var(--t);font-size:14px}
.ch-row:last-child{border-bottom:0}
.ch-row:hover{background:var(--panel-2)}
.ch-row.read .ch-title{color:var(--text-dim)}
.ch-row.read .ch-dot{background:var(--mute);opacity:.4}
.ch-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:none}
.ch-src{font-size:11.5px;font-weight:600;color:var(--blue);flex:none;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-title{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ch-time{font-size:11px;color:var(--mute);flex:none;white-space:nowrap}
.ch-star{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px;line-height:1;background:transparent;border:0;cursor:pointer;opacity:0;transition:opacity var(--t),color var(--t),background var(--t);flex:none}
.ch-row:hover .ch-star{opacity:1}
.ch-star:hover{background:var(--panel-hover);color:var(--text)}
.ch-star.on{opacity:1;color:var(--star)}

.channel .feed h3{margin-top:26px}
.channel .feed h3:first-child{margin-top:4px}

@media(max-width:640px){
  .ch-src{display:none}
  .ch-time{font-size:10px}
  .ch-row{padding:10px 12px;gap:8px}
  .ch-title{font-size:13px}
}

.end{text-align:center;color:var(--mute);font-size:11px;letter-spacing:.14em;margin:56px 0 30px;text-transform:uppercase}
.end::before,.end::after{content:"";display:inline-block;width:40px;height:1px;background:var(--line);vertical-align:middle;margin:0 14px}
.load-more-wrap{display:flex;justify-content:center;padding:12px 0 24px}

.rec3{display:flex;margin:0 -8px;gap:0}
.rtile{flex:1 1 0;min-width:0;margin:0 8px;height:120px;background:var(--panel) center/cover;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:0 12px;color:#fff;border:1px solid var(--line);text-shadow:0 1px 3px rgba(0,0,0,.6);transition:transform var(--t),box-shadow var(--t)}
.rtile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rtile .btn{text-shadow:none;font-size:11px;padding:5px 12px}

.empty{text-align:center;color:var(--mute);margin-top:100px;padding:0 20px}
.empty .big{font-size:34px;margin-bottom:12px;opacity:.5}
.empty h3{margin:0 0 6px;color:var(--text);font-size:17px;font-weight:600}
.empty p{margin:0;font-size:13px;line-height:1.6}

/* A welcoming first-run state that gives new readers a clear next step. */
.empty.welcome{position:relative;isolation:isolate;overflow:hidden;max-width:700px;margin:34px auto 0;padding:clamp(28px,6vw,58px) clamp(20px,5vw,52px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,var(--panel),var(--bg-soft));box-shadow:var(--shadow)}
.empty.welcome::before{content:"";position:absolute;z-index:-1;width:360px;height:240px;top:-150px;inset-inline-end:-70px;background:radial-gradient(ellipse,var(--blue-glow),transparent 70%);pointer-events:none}
.welcome-kicker{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--line-2);border-radius:999px;background:var(--bg-soft);color:var(--text-dim);font-size:11px;font-weight:600}
.welcome-kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.empty.welcome .big{display:grid;place-items:center;width:66px;height:66px;margin:22px auto 15px;border-radius:20px;background:var(--accent-grad);color:white;opacity:1;font-size:30px;box-shadow:0 12px 30px var(--blue-soft)}
.empty.welcome h3{font-size:clamp(21px,3vw,29px);letter-spacing:-.3px}
.empty.welcome p{max-width:430px;margin:8px auto 20px;color:var(--text-dim);font-size:14px}
.welcome-cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 20px;border-radius:12px;font-weight:600}
.welcome-hint{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;color:var(--mute);font-size:11px}
.welcome-hint span{width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.7}
@media(max-width:640px){.empty.welcome{margin:20px 0;padding:28px 18px;border-radius:18px}.welcome-hint{flex-wrap:wrap}}

.skel{height:160px;margin-bottom:14px;border-radius:var(--radius);background:var(--skeleton);background-size:200% 100%;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{to{background-position:-200% 0}}

.add{max-width:780px;margin:30px auto}
.add h3{font-size:20px;font-weight:600;margin:0 0 6px}
.add .sub{color:var(--mute);font-size:13px;margin:0 0 22px}

.found{margin:14px 4px;font-size:13px}
.found .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
.found .row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.found .ok{color:var(--green)}
.found .err{color:var(--red)}
.found .meta{color:var(--mute);font-size:11.5px}

.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-top:22px;padding:16px 20px}
.box h4{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.rec .row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:var(--radius-sm);gap:12px;transition:background var(--t)}
.rec .row:hover{background:var(--panel-2)}
.rec .row small{color:var(--mute);font-size:11.5px}
.rec .row.added{opacity:.55}
.rec .row .name{font-weight:500}

.lnk{background:none;border:0;color:var(--blue);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px}
.lnk:hover{background:var(--blue-soft)}

.btn{background:var(--blue);color:#fff;border:0;padding:8px 18px;cursor:pointer;font-size:13px;font-weight:500;border-radius:8px;transition:background var(--t),transform var(--t),box-shadow var(--t)}
.btn:hover{background:var(--blue-2);box-shadow:0 6px 16px var(--blue-soft)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel-2);color:var(--text)}
.btn.ghost:hover{background:var(--panel-hover);box-shadow:none}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#dc2626}

.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.set{margin-top:26px;font-size:12px;color:var(--mute);line-height:1.6}
.set label{display:block;margin-top:14px;color:var(--text-dim);font-weight:500;margin-bottom:5px}
.set input,.set select{width:100%;background:var(--bg-soft);border:1px solid var(--line-2);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;outline:none;transition:border-color var(--t),box-shadow var(--t)}
.set input:focus,.set select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.set .switch{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--text-dim);font-weight:500;cursor:pointer;user-select:none}
.set .switch input{width:auto;margin:0}

.font-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.font-picker button{text-align:start;padding:10px 12px;border-radius:8px;cursor:pointer;background:var(--bg-soft);border:1px solid var(--line-2);color:var(--text);font-size:13px;transition:all var(--t);font-family:var(--font-app);display:flex;flex-direction:column;gap:4px}
.font-picker button:hover{border-color:var(--blue)}
.font-picker button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px var(--blue-soft)}
.font-picker button .fp-name{font-weight:600;font-size:13px}
.font-picker button .fp-sample{font-size:11px;color:var(--mute);line-height:1.4}
@media(max-width:520px){.font-picker{grid-template-columns:1fr}}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line-2);border-radius:var(--radius);width:min(580px,92vw);padding:0;box-shadow:var(--shadow);animation:dlgIn .22s ease both}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dlg-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-head h3{margin:0;font-size:16px;font-weight:600}
.dlg-head .close{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:16px;line-height:1}
.dlg-head .close:hover{background:var(--panel-2);color:var(--text)}
.dlg-body{padding:18px 22px;max-height:70vh;overflow:auto}
.dlg-body ul{padding-inline-start:18px;margin:0}
.dlg-body li{margin:8px 0;line-height:1.5}
.dlg-body a{color:var(--text);text-decoration:none;border-bottom:1px solid transparent}
.dlg-body a:hover{color:var(--blue);border-color:var(--blue)}
.dlg-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--line-2);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:210;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red)}

#reader{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;animation:rdIn .22s ease both}
#reader[hidden]{display:none}
@keyframes rdIn{from{opacity:0}to{opacity:1}}
.rd-bar{flex:none;position:relative;display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;background:var(--header-bg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.rd-back{width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--text);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background var(--t),transform var(--t)}
.rd-back:hover{background:var(--panel-2)}
html[dir="rtl"] .rd-back{transform:scaleX(-1)}
.rd-title-bar{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.rd-src{font-size:12px;color:var(--blue);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-time{font-size:11px;color:var(--mute)}
.rd-actions{display:flex;gap:4px;flex:none;align-items:center}
.rd-font-wrap{position:relative}
.rd-font-btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background var(--t),border-color var(--t)}
.rd-font-btn:hover{background:var(--panel-2);border-color:var(--blue)}
.rd-font-btn .caret{font-size:9px;color:var(--mute)}
.rd-font-menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:10;display:none}
.rd-font-menu.open{display:block;animation:dlgIn .18s ease both}
.rd-font-menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-size:13px;text-align:start;transition:background var(--t)}
.rd-font-menu button:hover{background:var(--panel-2)}
.rd-font-menu button.on{background:var(--blue-soft);color:var(--blue)}
.rd-font-menu button .nm{font-weight:600}
.rd-font-menu button .prev{font-size:11px;color:var(--mute)}
.rd-btn{height:32px;min-width:32px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background var(--t),color var(--t)}
.rd-btn:hover{background:var(--panel-2);color:var(--text)}
.rd-progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent;overflow:hidden}
.rd-progress-fill{height:100%;width:0;background:var(--blue);transition:width .1s linear}
.rd-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.rd-content{max-width:720px;margin:0 auto;padding:36px 24px 100px;font-family:var(--font-reader);font-size:var(--rd-size);line-height:1.9;color:var(--text)}
.rd-content .rd-hero{width:100%;aspect-ratio:16/9;border-radius:var(--radius);background:var(--panel-2) center/cover;margin-bottom:22px}
.rd-content h1.rd-h1{font-size:calc(var(--rd-size) * 1.7);line-height:1.4;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
.rd-content .rd-byline{color:var(--mute);font-size:13px;margin-bottom:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rd-content .rd-byline .dot{width:4px;height:4px;border-radius:50%;background:var(--mute);display:inline-block}
.rd-content h2,.rd-content h3,.rd-content h4{line-height:1.5;margin:1.7em 0 .5em;letter-spacing:-.01em}
.rd-content h2{font-size:calc(var(--rd-size) * 1.35)}
.rd-content h3{font-size:calc(var(--rd-size) * 1.15)}
.rd-content p{margin:0 0 1.2em}
.rd-content img{max-width:100%;height:auto;border-radius:8px;margin:.6em 0;display:block}
.rd-content figure{margin:1.4em 0}
.rd-content figcaption{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
.rd-content a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue-glow)}
.rd-content a:hover{border-bottom-color:var(--blue)}
.rd-content blockquote{margin:1.2em 0;padding:6px 18px;border-inline-start:3px solid var(--blue);color:var(--text-dim);font-style:italic}
.rd-content pre,.rd-content code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.9em}
.rd-content pre{background:var(--panel);padding:14px 16px;border-radius:8px;overflow-x:auto;border:1px solid var(--line);direction:ltr;text-align:left}
.rd-content code{background:var(--panel-2);padding:2px 6px;border-radius:4px;direction:ltr;unicode-bidi:embed}
.rd-content pre code{background:none;padding:0}
.rd-content ul,.rd-content ol{padding-inline-start:1.4em;margin:0 0 1.2em}
.rd-content li{margin:.4em 0}
.rd-content hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.rd-content table{width:100%;border-collapse:collapse;margin:1em 0}
.rd-content th,.rd-content td{padding:8px 12px;border:1px solid var(--line);text-align:start}
.rd-content th{background:var(--panel-2)}
.rd-content[dir="rtl"] pre,
.rd-content[dir="rtl"] code,
.rd-content[dir="rtl"] pre *,
.rd-content[dir="rtl"] code *{direction:ltr;text-align:left;unicode-bidi:embed}
.rd-loading{text-align:center;color:var(--mute);padding:80px 20px;font-size:14px}
.rd-loading::after{content:"";display:block;width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:18px auto 0;animation:spin .8s linear infinite}
.rd-end{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);text-align:center}
.rd-end .btn{margin:0 4px}

@media(max-width:820px){
  .menu-btn{display:flex}

  main{padding-block:18px 60px;padding-inline:16px}
  .card .im{width:130px}
  .card{height:140px}
  .card .s{-webkit-line-clamp:2}
  .search-wrap{max-width:none}
  .rd-content{padding:24px 18px 80px;line-height:1.85}
  .rd-content h1.rd-h1{font-size:calc(var(--rd-size) * 1.5)}
  .rd-time{display:none}

  aside{
    display:block;
    position:fixed;
    top:var(--header-h);
    bottom:0;
    height:auto;
    width:min(320px, 86vw)!important;
    z-index:80;
    background:var(--panel);
    border-inline-end:1px solid var(--line);
    padding:14px 12px 30px;
    box-shadow:var(--shadow);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  html[dir="rtl"] aside{ right:0; left:auto; transform:translateX(105%); }
  html[dir="ltr"] aside{ left:0; right:auto; transform:translateX(-105%); }
  body.side-open aside{ transform:translateX(0); }

  .side-resizer{ display:none }

  .side-backdrop{
    display:none;
    position:fixed;
    inset:var(--header-h) 0 0 0;
    background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    z-index:70;
  }
  body.side-open .side-backdrop{ display:block; animation:fadeIn .2s ease both; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }

  body.side-open{ overflow:hidden }

  aside .nav-link{ padding:11px 12px; font-size:14px }
  aside .nav-link .ico{ font-size:15px }
  aside .nav-link .badge{ font-size:12px; padding:2px 9px }
  .src-row .mini{ opacity:1; width:34px; height:34px; font-size:15px }
  aside .grp{ font-size:12px; margin:18px 8px 8px }
}

/* ============ NEW: Archive page ============ */
.archive-page{max-width:920px;margin:0 auto}
.archive-bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.archive-bar .search{height:38px;flex:1;min-width:200px;padding-inline:16px}
.archive-stat{font-size:12px;color:var(--mute);white-space:nowrap}
.archive-list{display:flex;flex-direction:column;gap:8px}
.arc-item{display:flex;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);transition:border-color var(--t),box-shadow var(--t);align-items:center}
.arc-item:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.arc-img{width:80px;height:60px;flex:none;border-radius:6px;background:var(--panel-2) center/cover no-repeat}
.arc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.arc-title{font-size:14px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer;color:var(--text)}
.arc-title:hover{color:var(--blue)}
.arc-meta{font-size:11px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.arc-meta b{color:var(--blue);font-weight:500}
.arc-actions{display:flex;gap:4px;flex:none}
.arc-btn{width:30px;height:30px;border:0;background:transparent;color:var(--mute);cursor:pointer;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background var(--t),color var(--t)}
.arc-btn:hover{background:var(--panel-hover);color:var(--text)}
.arc-btn.rm:hover{color:var(--red)}
.arc-empty{text-align:center;padding:60px 20px;color:var(--mute)}

/* ============ NEW: Yearly heatmap ============ */
.heatmap-wrap{overflow-x:auto;padding:4px 0 10px}
.heatmap-inner{display:inline-flex;gap:6px}
.heatmap-days{display:grid;grid-template-rows:repeat(7,12px);gap:3px;font-size:9px;color:var(--mute);padding-top:0}
.heatmap-days span{height:12px;line-height:12px;text-align:end;padding-inline-end:4px}
.heatmap-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
.heat-cell{width:12px;height:12px;border-radius:2px;background:var(--line);cursor:pointer;transition:transform .12s ease,outline-color .12s}
.heat-cell:hover{transform:scale(1.35);outline:1px solid var(--text);outline-offset:0}
.heat-cell.future{background:transparent;cursor:default}
.heat-cell.l1{background:var(--heat-1)}
.heat-cell.l2{background:var(--heat-2)}
.heat-cell.l3{background:var(--blue)}
.heat-cell.l4{background:var(--green)}
.heat-month-lbl{display:flex;font-size:9px;color:var(--mute);padding-inline-start:22px;margin-bottom:2px}
.heat-legend{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--mute);margin-top:8px}
.heat-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.heat-tooltip{position:fixed;z-index:230;background:var(--panel);border:1px solid var(--line-2);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .15s}
.heat-tooltip.on{opacity:1}

/* ============ NEW: Daily digest ============ */
.digest{max-width:920px;margin:0 auto}
.digest-hero{background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;margin-bottom:20px;position:relative;overflow:hidden}
.digest-hero::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,var(--blue-glow),transparent 70%);pointer-events:none}
.digest-hero .greet{font-size:22px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.digest-hero .sun{font-size:26px}
.digest-hero .sub{color:var(--text-dim);font-size:14px;margin:0;line-height:1.7}
.digest-hero .sub b{color:var(--blue);font-weight:600}
.digest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:22px}
.digest-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;border-inline-start:3px solid var(--accent,var(--blue))}
.digest-card h3{font-size:12px;font-weight:600;margin:0 0 12px;color:var(--accent,var(--blue));text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.digest-card .num{font-size:32px;font-weight:700;line-height:1.1;color:var(--accent,var(--blue));letter-spacing:-.5px}
.digest-items{display:flex;flex-direction:column}
.digest-item{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:flex-start;text-decoration:none;color:inherit;border-radius:4px;transition:background var(--t);position:relative}
.digest-item:last-child{border-bottom:0}
.digest-item:hover{background:var(--panel-2)}
.digest-item .t{flex:1;min-width:0;font-size:13px;line-height:1.45;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.digest-item .meta{font-size:10.5px;color:var(--mute);margin-top:3px;display:flex;gap:6px}
.digest-item .meta b{color:var(--blue);font-weight:500}
.digest-item .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.digest-item.read .dot{background:var(--mute);opacity:.4}
.digest-item.read .t{color:var(--text-dim)}
.digest-empty{padding:16px 4px;color:var(--mute);font-size:12px;text-align:center}

/* ============ NEW: TTS settings panel ============ */
.tts-panel{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tts-panel label{margin:0}
.tts-panel select,.tts-panel input{width:100%}
.tts-panel .full{grid-column:1/-1}
@media(max-width:520px){.tts-panel{grid-template-columns:1fr}}

/* TTS paragraph highlight */
.tts-highlight{background:linear-gradient(90deg,var(--blue-soft),transparent);border-radius:4px;box-shadow:inset 3px 0 0 var(--blue);transition:background .2s}
[dir=auto]{unicode-bidi:plaintext}

/* ===== Design system: soft blue-gray surfaces, one accent hue, rounded cards ===== */
::selection{background:var(--blue-soft);color:var(--text)}
/* Scrollbars (dialogs, reader, sidebar, page) follow the theme instead of the OS default. */
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid transparent;border-radius:99px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--mute);background-clip:padding-box}
img{content-visibility:auto}
.card{content-visibility:auto;contain-intrinsic-size:auto 160px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Brand mark: rounded tile filled with the accent gradient. */
.logo{position:relative;width:30px;height:30px;border:0;border-radius:10px;background:var(--accent-grad);box-shadow:0 6px 16px var(--blue-soft);overflow:hidden}
.logo::after{
  content:"";position:absolute;inset:0;border-radius:0;opacity:1;background:
    linear-gradient(#fff,#fff) 8px 9px/14px 2.5px no-repeat,
    linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.72)) 8px 14px/10px 2.5px no-repeat,
    linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.72)) 8px 19px/12px 2.5px no-repeat;
}

/* Header */
header{height:var(--header-h);padding-inline:18px;gap:14px;background:var(--header-bg);border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(15,23,42,.05)}
[data-theme="dark"] header{box-shadow:0 6px 24px rgba(0,0,0,.3)}
header h1{font-size:14.5px;font-weight:700;letter-spacing:.2px}

/* Fields */
.search{border-radius:11px;height:38px;border:1px solid var(--line);background:var(--panel-2)}
.search:focus{border-color:var(--blue);background:var(--panel);box-shadow:0 0 0 3px var(--blue-soft)}
.set input,.set select{border-radius:11px;border:1px solid var(--line);background:var(--panel-2)}
.set input:focus,.set select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.font-picker button{border-radius:11px;background:var(--panel-2);border:1px solid var(--line)}
.font-picker button:hover{border-color:var(--blue)}
.font-picker button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px var(--blue-soft)}

/* Buttons */
.btn{border-radius:10px;padding:9px 17px;font-weight:600;box-shadow:none}
.btn:hover{box-shadow:0 6px 16px var(--blue-soft)}
.btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel-hover);border-color:var(--line-2);box-shadow:none}

/* Header actions and segmented controls */
.icon-btn{border-radius:10px}
.icon-btn:hover{background:var(--blue-soft);color:var(--blue)}
.seg{background:var(--panel-2);border:0;padding:3px;border-radius:12px}
.seg button{border-radius:9px}
.seg button:hover{background:var(--panel-hover)}
.seg button.on{background:var(--blue);box-shadow:none}
.opts-pop{border-radius:16px;box-shadow:var(--shadow-lg)}

/* Native controls follow the accent hue too. */
input[type="checkbox"],input[type="radio"],input[type="range"],progress{accent-color:var(--blue)}

/* Sidebar */
aside{background:var(--bg-soft);border-inline-end:1px solid var(--line)}
.nav-link{border-radius:10px}
.nav-link.on{box-shadow:none;background:var(--blue-soft);color:var(--blue);font-weight:600}

/* Surfaces */
.card,.np-hero,.np-sec,.stat-card,.arc-item,.digest-card,.channel-list,.box,.np-headlines{border-radius:var(--radius)}
.card{border-color:var(--line);background:var(--panel);box-shadow:none}
.card:hover{transform:none;background:var(--panel);border-color:var(--line-2);box-shadow:var(--shadow)}
.card:not(.read) .meta .dot{box-shadow:0 0 0 3px var(--blue-soft)}
.feed h3{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--text-dim)}
.np-hero,.np-sec,.np-headlines,.stat-card,.stats-section,.digest-card,.arc-item,.box,.channel-list{box-shadow:none}
.np-hero:hover,.np-sec:hover,.arc-item:hover{transform:none;border-color:var(--line-2);box-shadow:var(--shadow)}
.stat-card:hover{transform:none}

/* Dialogs, toasts */
dialog{border-radius:16px;border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(4px)}
.toast{background:var(--toast-bg);color:var(--toast-text);border:0;border-radius:11px;padding:11px 18px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.ok{box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 1.5px var(--green)}
.toast.err{box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 1.5px var(--red)}
.empty.welcome{border-radius:22px;background:var(--panel);box-shadow:var(--shadow)}

/* Accent-hue picker */
.accent-picker{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.accent-sw{width:32px;height:32px;border-radius:10px;border:2px solid transparent;padding:0;cursor:pointer;transition:transform var(--t),border-color var(--t),box-shadow var(--t);background:linear-gradient(135deg,hsl(var(--h) 91% 63%),hsl(var(--h) 91% 49%))}
.accent-sw:hover{transform:scale(1.12)}
.accent-sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel)}

@media(max-width:820px){
  header{gap:8px;padding-inline:12px}
  .head-actions{gap:0}
  .head-actions .icon-btn{width:34px;height:34px}
  aside{border-inline-end:0;background:var(--panel)}
}
@media(hover:none){.save-btn,.card-action.share-btn,.np-hero .save-btn,.np-sec .save-btn,.np-head .save-btn,.src-row .mini,.tag-link .tag-ren{opacity:.75}.save-btn.on{opacity:1}}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.seg .ic{width:16px;height:16px}.search-icon .ic{width:16px;height:16px}
.seg button{display:inline-flex;align-items:center;justify-content:center}
.icon-btn.hide{display:none}
.opts{position:relative}
.opts-pop{position:absolute;inset-inline-end:0;top:calc(100% + 8px);z-index:80;min-width:230px;display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg)}
.opts-pop[hidden]{display:none}
.opts-row{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--text-dim)}
.opts-row:has(.seg.hide){display:none}
.opts-keys{display:flex;align-items:center;gap:8px;padding:8px 6px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--text-dim);font-size:12.5px;cursor:pointer}
.opts-keys:hover{color:var(--text)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;font-size:13.5px}
.keys kbd{justify-self:start;direction:ltr;min-width:30px;text-align:center;padding:3px 9px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:7px;background:var(--panel-2);font:600 12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.today-src{font-size:12px;font-weight:600;color:var(--text-dim);margin:16px 0 4px}
.today-src:first-of-type{margin-top:2px}
.today-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.today-done{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 10px}
.today-done b{font-size:16px;color:var(--text)}.today-done span{color:var(--mute)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"></div>
    <h1 id="appTitle">Personal news</h1>
  </div>
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="search-wrap">
    <span class="search-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input id="search" class="search" placeholder="" autocomplete="off" spellcheck="false">
    <button class="search-clear" id="searchClear" hidden aria-label="">✕</button>
  </div>
  <div class="head-actions">
    <button class="icon-btn" id="digestBtn" aria-label=""><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="icon-btn" id="liveTranslateBtn" aria-label=""><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 6 7M12 5c-.5 3-3 6-7 7.5M13 21l4-9 4 9M14.5 18h5"/></svg></button>
    <button class="icon-btn" id="refreshBtn" aria-label=""><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <button class="icon-btn" id="themeBtn" aria-label=""><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" style="fill:currentColor"/></svg></button>
    <button class="icon-btn" id="settingsBtn" aria-label=""><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</header>

<div class="layout">
  <aside id="side"></aside>
  <div class="side-resizer" id="sideResizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
  <div class="side-backdrop" id="sideBackdrop" aria-hidden="true"></div>
  <main>
    <div class="top">
      <div class="title-wrap">
        <h2 id="ttl"></h2>
        <span class="count" id="cnt"></span>
      </div>
      <div class="tact">
        <div class="seg" id="filterSeg">
          <button data-filter="all" id="filterAll"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 12h5l1.5 2.5h3L15 12h5"/></svg></button>
          <button data-filter="unread" id="filterUnread"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" style="fill:currentColor"/></svg></button>

/* ============ IndexedDB (archive + persistent feed history) ============ */
const idb = (() => {
  const NAME = "personal-news-db", VER = 3;
  let dbP = null;
  function open(){
    if (dbP) return dbP;
    dbP = new Promise((res, rej) => {
      if (!("indexedDB" in window)) return rej(new Error("no-idb"));
      const r = indexedDB.open(NAME, VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains("articles")){
          const s = db.createObjectStore("articles", {keyPath: "link"});
          s.createIndex("archivedAt", "archivedAt");
          s.createIndex("date", "date");
          s.createIndex("source", "source");
        }
        const makeFeedStore = () => {
          const s = db.createObjectStore("feedItems", {keyPath: "id"});
          s.createIndex("sourceUrl", "sourceUrl"); s.createIndex("date", "date");
          return s;
        };
        if (!db.objectStoreNames.contains("feedItems")) makeFeedStore();
        else {
          const oldItems = r.transaction.objectStore("feedItems").getAll();
          oldItems.onsuccess = () => {
            const rows = oldItems.result || [];
            db.deleteObjectStore("feedItems");
            const s = makeFeedStore();
            rows.filter(a => a && a.sourceUrl && a.link).forEach(a => s.put({...a, id: `${a.sourceUrl}\n${a.link}`}));
          };
        }
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbP;
  }
  const tx = async (storeName, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(storeName, mode);
      const s = t.objectStore(storeName);
      let out;
      try { out = fn(s); } catch (e){ return rej(e); }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    put: (storeName, obj) => tx(storeName, "readwrite", s => s.put(obj)),
    putMany: (storeName, objects) => tx(storeName, "readwrite", s => objects.forEach(obj => s.put(obj))),
    delMany: (storeName, keys) => tx(storeName, "readwrite", s => keys.forEach(k => s.delete(k))),
    get: (storeName, key) => tx(storeName, "readonly",  s => s.get(key)),
    byIndex: (storeName, indexName, value) => tx(storeName, "readonly", s => s.index(indexName).getAll(IDBKeyRange.only(value))).then(v => v || []),
    deleteByIndex: (storeName, indexName, value) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction(storeName, "readwrite"), s = t.objectStore(storeName);
      const req = s.index(indexName).openKeyCursor(IDBKeyRange.only(value));
      req.onsuccess = () => { const c = req.result; if (c){ s.delete(c.primaryKey); c.continue(); } };
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    })),
    replaceData: (archived, feeds) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction(["articles", "feedItems"], "readwrite");
      const a = t.objectStore("articles"), f = t.objectStore("feedItems");
      a.clear(); f.clear();
      archived.forEach(x => a.put(x)); feeds.forEach(x => f.put(x));
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    })),
    del: (storeName, key) => tx(storeName, "readwrite", s => s.delete(key)),
    clear: (storeName) => tx(storeName, "readwrite", s => s.clear()),
    count: (storeName) => tx(storeName, "readonly",  s => s.count()),
    all: (storeName) => tx(storeName, "readonly",  s => s.getAll()).then(v => v || [])
  };
})();

let archiveCache = null;
let archiveCachePromise = null;
async function loadArchive(){
  if (archiveCache) return archiveCache;
  if (archiveCachePromise) return archiveCachePromise;
  archiveCachePromise = (async () => {
    try {
      const all = await idb.all("articles");
      all.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));
      archiveCache = all;
    } catch { archiveCache = []; }
    return archiveCache;
  })();
  return archiveCachePromise;
}
async function saveToArchive(rec){
  try {
    await idb.put("articles", rec);
    if (archiveCache){
      archiveCache = [rec, ...archiveCache.filter(x => x.link !== rec.link)];
    }
  } catch {}
}
async function removeFromArchive(link){
  try { await idb.del("articles", link); } catch {}
  if (archiveCache) archiveCache = archiveCache.filter(x => x.link !== link);
}
async function clearArchive(){
  try { await idb.clear("articles"); } catch {}
  archiveCache = [];
}
async function loadFeedCache(){
  await Promise.all(sources.map(async s => {
    try {
      const items = await idb.byIndex("feedItems", "sourceUrl", s.url);
      articles[s.url] = items.filter(a => a && a.link && a.title).map(a => {
      a.source = s.title; a.sourceUrl = s.url; a.id = `${s.url}\n${a.link}`; a.done = true;
        if (ic[a.link]){ a.img = ic[a.link].img || a.img; a.ok = !!ic[a.link].ok; }
        return a;
      }).sort((a, b) => (b.date || 0) - (a.date || 0));
    } catch { articles[s.url] = articles[s.url] || []; }
  }));
  feedCacheReady = true;
}

/* ============ Networking ============ */
const customProxy = () => store.get("proxy", "");
function proxies(){
  const list = [u => u,
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?" + encodeURIComponent(u),
    u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u)];
  const c = customProxy();
  if (c) list.unshift(u => c.includes("{url}") ? c.replace("{url}", encodeURIComponent(u)) : c + u);
  return list;
}
async function fetchText(url, ms = 9000){
  const deadline = Date.now() + Math.max(500, Math.min(ms, 8000));
  const proxyList = proxies();
  const direct = proxyList[0];
  const proxiedList = proxyList.slice(1);
  let lastError = new Error("Network error");
  const directRemaining = deadline - Date.now();
  if (directRemaining > 0){
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), Math.min(2200, directRemaining));
    try {
      const r = await fetch(direct(url), {signal: ctl.signal});
      if (r.ok) return await r.text();
      lastError = new Error("HTTP " + r.status);
    } catch (e) { lastError = e; }
    finally { clearTimeout(timer); }
  }
  const remaining = deadline - Date.now();
  if (remaining <= 0) throw lastError;
  const controllers = [];
  const timers = [];
  let timeoutId;
  try {
    const promises = proxiedList.map(p => {
      const ctl = new AbortController();
      controllers.push(ctl);
      timers.push(setTimeout(() => ctl.abort(), remaining));
      return (async () => {
        const r = await fetch(p(url), {signal: ctl.signal});
        if (r.ok) return await r.text();
        throw new Error("HTTP " + r.status);
      })();
    });
    const timeoutPromise = new Promise((_, reject) => {
      timeoutId = setTimeout(() => reject(new Error("timeout")), remaining);
    });
    return await Promise.race([Promise.any(promises), timeoutPromise]);
  } catch (aggErr) {
    const errs = (aggErr && aggErr.errors) || [aggErr];
    for (const e of errs) {
      if (e && e.message && !e.message.includes("aborted") && !e.message.includes("timeout")) throw e;
    }
    throw lastError || errs[0] || new Error("Network error");
  } finally {
    clearTimeout(timeoutId);
    timers.forEach(clearTimeout);
    controllers.forEach(ctl => ctl.abort());
  }
}
function proxyImageUrls(url){
  const out = [];
  const c = customProxy();
  if (c) out.push(c.includes("{url}") ? c.replace("{url}", encodeURIComponent(url)) : c + url);
  out.push("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
  out.push("https://corsproxy.io/?" + encodeURIComponent(url));
  out.push("https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(url));
  return out;
}

/* ============ URL / direction ============ */
function resolveImgUrl(src, base){
  if (!src) return "";
  src = String(src).trim();
  if (!src) return "";
  if (/^(data|blob):/i.test(src)) return src;
  if (src.startsWith("//")) src = location.protocol + src;
  try {
    const u = new URL(src, base || location.href);
    if (u.protocol === "http:" && location.protocol === "https:") u.protocol = "https:";
    return u.href;
  } catch { return src; }
}
function isRtlChar(cp){
  return (cp >= 0x0590 && cp <= 0x05FF) || (cp >= 0x0600 && cp <= 0x06FF) ||
         (cp >= 0x0700 && cp <= 0x074F) || (cp >= 0x0750 && cp <= 0x077F) ||
         (cp >= 0x08A0 && cp <= 0x08FF) || (cp >= 0xFB1D && cp <= 0xFDFF) ||
         (cp >= 0xFE70 && cp <= 0xFEFF);
}
function isLtrChar(cp){
  return (cp >= 0x0041 && cp <= 0x005A) || (cp >= 0x0061 && cp <= 0x007A) ||
         (cp >= 0x00C0 && cp <= 0x024F);
}
function detectDirection(text){
  if (!text) return "ltr";
  let rtl = 0, ltr = 0;
  for (const ch of text){
    const cp = ch.codePointAt(0);
    if (isRtlChar(cp)) rtl++;
    else if (isLtrChar(cp)) ltr++;
  }
  if (rtl === 0) return "ltr";
  return rtl >= ltr * 0.6 ? "rtl" : "ltr";
}

function parseFeed(text){
  const doc = new DOMParser().parseFromString(text.trim(), "text/xml");
  if (doc.querySelector("parsererror")) return null;
  const root = doc.documentElement, name = root.localName.toLowerCase();
  const txt = (el, tag) => { const n = el && [...el.children].find(c => c.localName === tag); return n ? n.textContent.trim() : ""; };
  const all = (el, tag) => [...el.getElementsByTagNameNS("*", tag)];
  const collectImgs = (html, base) => {
    const out = [];

const _plainCache = new Map();

/* ============ Discovery ============ */
const looksFeed = t => /<(rss|feed|rdf:RDF)[\s>]/i.test(t.slice(0, 3000));
function normalizeUrl(s){
  s = s.trim();
  if (!s || /\s/.test(s) || !s.includes(".")) return null;
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  try { return new URL(s).href } catch { return null }
}
async function probe(url){
  try {
    const t = await fetchText(url, 5000);
    if (!looksFeed(t)) return null;
    const f = parseFeed(t);
    return f ? {url, title: f.title || new URL(url).hostname, kind: f.kind, count: f.items.length} : null;
  } catch { return null }
}
async function probeAll(urls, onFound, deadlineMs = 8000){
  const results = [];
  const seen = new Set();
  const queue = [...new Set(urls)].slice(0, 48);
  if (!queue.length || deadlineMs <= 0) return results;
  let next = 0;
  let stopped = false;
  let timeoutId;
  const timeout = new Promise(resolve => {
    timeoutId = setTimeout(() => { stopped = true; resolve(); }, deadlineMs);
  });
  const workers = Array.from({length: Math.min(5, queue.length)}, async () => {
    while (!stopped && next < queue.length){
      const u = queue[next++];
      try {
        const r = await probe(u);
        if (r && !seen.has(r.url)){
          seen.add(r.url);
          results.push(r);
          if (onFound) onFound(r, results.slice());
        }
      } catch {}
    }
  });
  await Promise.race([Promise.all(workers), timeout]);
  clearTimeout(timeoutId);
  return results;
}
let discoverToken = 0;
async function discover(input, onStep){
  const url = normalizeUrl(input);
  if (!url) return [];
  const myToken = ++discoverToken;
  const isCancelled = () => myToken !== discoverToken;
  const deadline = Date.now() + 24000;
  const isExpired = () => Date.now() > deadline;
  const found = [];
  const seen = new Set();
  const push = r => { if (r && !seen.has(r.url)){ seen.add(r.url); found.push(r); return true; } return false; };
  const notify = () => onStep && onStep(null, found.slice());

  const candidates = new Set();
  const addHttpUrl = (set, raw, base) => {
    try {
      const u = new URL(raw, base);
      if (u.protocol !== "http:" && u.protocol !== "https:") return;
      u.hash = "";
      set.add(u.href);
    } catch {}
  };
  const inspectPage = (html, pageUrl, siteHost) => {
    const d = new DOMParser().parseFromString(html, "text/html");
    let base = pageUrl;
    const baseEl = d.querySelector("base[href]");
    if (baseEl){ try { base = new URL(baseEl.getAttribute("href"), pageUrl).href } catch {} }
    for (const l of d.querySelectorAll('link[rel~="alternate"][href]')){
      const type = (l.getAttribute("type") || "").toLowerCase();
      if (/rss|atom|\bxml\b|feed/.test(type)) addHttpUrl(candidates, l.getAttribute("href"), base);
    }
    for (const a of d.querySelectorAll("a[href]")){
      const h = a.getAttribute("href") || "";
      if (/(^|\/)(feed|rss|atom)(\/|\.xml|\.rss|$)|\.(rss|atom)(\?|$)|\?feed=/i.test(h)) addHttpUrl(candidates, h, base);
    }

    const pageLinks = new Map();
    const categoryPath = /\/(?:category|categories|section|sections|topic|topics|archive|archives|tag|tags)\//i;
    const skipPath = /\/(?:login|signin|register|search|contact|privacy|terms|forum|author|account)(?:\/|$)/i;
    const menuLinks = d.querySelectorAll('nav a[href], header a[href], [role="navigation"] a[href], [class*="menu"] a[href], [class*="nav"] a[href], [id*="menu"] a[href], [id*="nav"] a[href]');
    const menuSet = new Set(menuLinks);
    for (const a of d.querySelectorAll("a[href]")){
      const href = a.getAttribute("href") || "";
      let target;
      try { target = new URL(href, base); } catch { continue; }
      if ((target.protocol !== "http:" && target.protocol !== "https:") || target.hostname.replace(/^www\./i, "") !== siteHost) continue;
      target.hash = "";
      if (target.href === pageUrl || target.search || skipPath.test(target.pathname)) continue;
      const path = target.pathname.replace(/\/$/, "");
      if (/\.(?:pdf|zip|rar|7z|png|jpe?g|gif|webp|mp4|mp3|css|js)$/i.test(path)) continue;
      const depth = path.split("/").filter(Boolean).length;
      const inMenu = menuSet.has(a);
      const categoryLike = categoryPath.test(target.pathname) || /\b(categories|sections|topics|news|feeds?)\b/i.test((a.textContent || "") + " " + target.pathname);
      if (depth > 5 || (!inMenu && !categoryLike)) continue;
      // Short links in site navigation are usually section pages; skip deep article pages.
      if (!categoryLike && depth > 3) continue;
      const score = (categoryLike ? 4 : 0) + (inMenu ? 2 : 0) + Math.max(0, 4 - depth);
      if (!pageLinks.has(target.href) || pageLinks.get(target.href).score < score) pageLinks.set(target.href, {url: target.href, score});
    }
    return [...pageLinks.values()].sort((a, b) => b.score - a.score).map(x => x.url);
  };

  onStep && onStep(t("checkingPage"));
  let html = "";
  try { html = await fetchText(url, 6000); } catch {}
  if (isCancelled()) return found;

  if (html && looksFeed(html)){
    const f = parseFeed(html);
    if (f){
      push({url, title: f.title || new URL(url).hostname, kind: f.kind, count: f.items.length, isDirect: true});
      notify();
    }
    return found;
  }

  let sectionPages = [];
  if (html){
    try { sectionPages = inspectPage(html, url, new URL(url).hostname.replace(/^www\./i, "")).slice(0, 12); } catch {}
  }

  // Many sites advertise category feeds only on their section pages. Inspect a
  // small set of same-site navigation links so those feeds are discoverable too.
  if (sectionPages.length && !isExpired()){
    let nextPage = 0;
    const workers = Array.from({length: Math.min(8, sectionPages.length)}, async () => {
      while (!isCancelled() && !isExpired() && nextPage < sectionPages.length){
        const pageUrl = sectionPages[nextPage++];
        try {
          const pageHtml = await fetchText(pageUrl, Math.min(4000, Math.max(1000, deadline - Date.now())));
          if (isCancelled()) return;
          if (looksFeed(pageHtml)) addHttpUrl(candidates, pageUrl, url);
          else inspectPage(pageHtml, pageUrl, new URL(url).hostname.replace(/^www\./i, ""));
        } catch {}
      }
    });
    await Promise.race([Promise.all(workers), new Promise(r => setTimeout(r, Math.max(0, deadline - Date.now())))]);
  }
  if (isCancelled()) return found;

  // Try conventional endpoints after advertised feeds so the candidate limit
  // never hides real feeds discovered in page metadata.
  try {
    const u = new URL(url);
    const bases = new Set([u.origin]);
    if (u.pathname.length > 1) bases.add(u.origin + u.pathname.replace(/\/$/, ""));
    for (const b of bases) for (const p of COMMON_PATHS) candidates.add(b + p);
  } catch {}

  const candList = [...candidates].slice(0, 48);
  if (!candList.length){ onStep && onStep(null, found.slice()); return found; }
  onStep && onStep(t("verifyingFeeds", {n: candList.length}));
  const remaining = Math.max(0, deadline - Date.now());
  await probeAll(candList, r => { if (isCancelled()) return; if (push(r)) notify(); }, remaining);
  if (isCancelled()) return found;

  found.sort((a, b) => {
    if (!!a.isDirect !== !!b.isDirect) return a.isDirect ? -1 : 1;
    return (b.count || 0) - (a.count || 0);
  });
  return found;
}

let active = 0; const waiting = [];

function patchCard(a){

    if (!patchCard(a)) soon();
    return;
  }
  const rawCands = Array.isArray(a.imgCandidates) && a.imgCandidates.length ? a.imgCandidates.slice() : (a.img ? [a.img] : []);
  const cands = [...new Set(rawCands.map(u => resolveImgUrl(u, a.link)).filter(Boolean))];

  if (primary) ok = await limit(() => probeImg(primary, {useReferrer: false, timeout: 5000}));

  persistItem(a);
  if (!patchCard(a)) soon();
  if (ok) return;
  (async () => {
    let url = primary, got = false;
    if (primary) got = await limit(() => probeImg(primary, {useReferrer: true, timeout: 6000}));

        const u = cands[i];
        if (await limit(() => probeImg(u, {useReferrer: false, timeout: 6000}))){ url = u; got = true; break; }
        if (await limit(() => probeImg(u, {useReferrer: true, timeout: 5000}))){ url = u; got = true; break; }
      }

      const o = await limit(() => ogImage(a.link));
      if (o && !cands.includes(o)){

    else { ic[a.link] = {img: a.img, ok: false}; }

}

async function loadSource(s){
  let loaded = false;
  try {
    const f = parseFeed(await fetchText(s.url));
    if (!f) throw new Error("invalid-feed");
    const previous = new Map((articles[s.url] || []).map(a => [a.link, a]));
    const fresh = f ? f.items.filter(i => i.link && i.title).map(i => {
      const old = previous.get(i.link);
      const item = {...old, ...i, source: s.title, sourceUrl: s.url};
      if (old && !i.img){ item.img = old.img || ""; item.imgCandidates = old.imgCandidates || []; }
      delete item.done;
      return item;
    }) : [];
    for (const item of fresh) previous.set(item.link, item);
    const sorted = [...previous.values()].sort((a, b) => (b.date || 0) - (a.date || 0));
    const items = sorted.slice(0, KEEP_PER_SOURCE), keepL = new Set(items.map(a => a.link));
    const pruned = sorted.slice(KEEP_PER_SOURCE);
    articles[s.url] = items;
    if (pruned.length) idb.delMany("feedItems", pruned.map(a => `${s.url}\n${a.link}`)).catch(() => {});
    try { await idb.putMany("feedItems", fresh.filter(a => keepL.has(a.link)).map(a => ({...a, id: `${s.url}\n${a.link}`}))); }
    catch { if (!feedCacheWarned){ feedCacheWarned = true; toast(t("feedCacheFailed"), "err"); } }
    fresh.slice(0, 30).forEach(resolveItem);
    loaded = true;
  } catch { if (!articles[s.url]) articles[s.url] = []; }
  soon();
  return loaded;
}
async function refreshAll(){

  const queue = sources.slice();
  let succeeded = 0, failed = 0;
  await Promise.all(Array.from({length: Math.min(4, queue.length)}, async () => {

    }
  }));

  render();
  if (!failed) toast(t("feedsRefreshed"), "ok");
  else if (succeeded) toast(t("feedsRefreshPartial", {ok:succeeded, failed}), "");
  else toast(t("feedsRefreshFailed", {n:failed}), "err");
}
